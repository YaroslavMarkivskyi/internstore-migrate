services:
  # STR-155/STR-181/STR-192: local-dev-only stand-in for a real Firebase
  # project, same category as MinIO (GCS stand-in) / Mailpit (SMTP
  # stand-in) elsewhere in this stack. auth-backend talks to this via
  # FIREBASE_AUTH_EMULATOR_HOST — firebase_admin redirects every call there
  # automatically once that's set, no code branching. See
  # firebase/README.md for why this image specifically (measured against
  # node:20-alpine + npx on every boot) and the `host: 0.0.0.0` requirement
  # (the emulator's default 127.0.0.1 bind is unreachable through Docker's
  # port mapping — a real gotcha hit while building this, not a
  # theoretical one).
  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    command: firebase emulators:start --only auth --project internstore-dev
    working_dir: /home/node
    volumes:
      - ./firebase:/home/node
    ports:
      - "9099:9099" # Auth emulator API
      # No Emulator UI (:4000) -- it needs its own zip download on every
      # cold start (no image-side cache for it) and that download flaked
      # in practice, taking down the one thing (the Auth emulator API)
      # auth-backend actually depends on. Not worth a debug UI being a
      # single point of failure for local dev bootstrap.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:9099/emulator/v1/projects/internstore-dev/config',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth-backend:
    build: ./services/auth-backend
    environment:
      PORT: "3000"
      # STR-192: must match firebase-emulator's --project flag above and
      # scripts/seed-firebase-users.py's default.
      FIREBASE_PROJECT_ID: internstore-dev
      # Redirects every firebase_admin call to the local emulator instead
      # of real Firebase — this line is the only local/GCP difference in
      # auth-backend's config; it must never appear in k8s/overlays/gcp
      # (real Firebase there).
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      INTERNAL_TOKEN_TTL_SECONDS: "60"
      REDIS_URL: redis://redis:6379
    ports:
      # Exposed directly too, for testing /me and /auth/verify without
      # going through nginx (see scripts/test-auth-flows.sh). Host port is
      # :3001 (not :3000) because :3000 is a common local conflict
      # (Grafana etc.); the container still listens on :3000, so nginx's
      # `auth-backend:3000` upstream is unchanged.
      - "3001:3000"
    volumes:
      # Live bind mount so source edits take effect via uvicorn --reload
      # without a `docker compose build`/`up` cycle. Only `src` is mounted
      # (not the whole service dir) so the image's own installed
      # .venv/dependencies aren't shadowed by whatever's on the host.
      - ./services/auth-backend/src:/app/src
    depends_on:
      firebase-emulator:
        condition: service_healthy
      redis:
        condition: service_started

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog:
    build: ./services/catalog
    environment:
      # Not the network-facing port anymore -- catalog-gate (nginx) below
      # occupies :8000 (what every other service still calls
      # catalog:8000, unchanged) and proxies here. HOST=127.0.0.1 means
      # this is unreachable from outside this pod's shared network
      # namespace even if something guesses the port -- catalog-gate/
      # catalog-verify/catalog-opa are the only peers that share it.
      PORT: "8010"
      HOST: "127.0.0.1"
      DATABASE_URL: postgresql+asyncpg://catalog:catalog@catalog-db:5432/catalog
      # No longer used by catalog itself (see auth.py's removal below) --
      # still required by auth-backend/other services, kept here too in
      # case a future call site needs it again.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Product image storage — a real GCS bucket over its S3-compatible
      # XML API + an HMAC key (see object_storage_client.py). Shares one
      # bucket with Chat's attachments, isolated by the catalog/ key
      # prefix. Set GCS_BUCKET / GCS_HMAC_ACCESS_KEY / GCS_HMAC_SECRET in
      # the root .env (see .env.example). Same bucket/keys as k8s on GCP —
      # local dev is no longer a MinIO stand-in.
      OBJECT_STORAGE_ENDPOINT: https://storage.googleapis.com
      OBJECT_STORAGE_PUBLIC_BASE_URL: https://storage.googleapis.com
      OBJECT_STORAGE_ACCESS_KEY: ${GCS_HMAC_ACCESS_KEY:?set GCS_HMAC_ACCESS_KEY in .env}
      OBJECT_STORAGE_SECRET_KEY: ${GCS_HMAC_SECRET:?set GCS_HMAC_SECRET in .env}
      OBJECT_STORAGE_BUCKET: ${GCS_BUCKET:?set GCS_BUCKET in .env}
      OBJECT_STORAGE_KEY_PREFIX: catalog/
      # For checking a product's cross-stock quantity before letting it be
      # (re)published — see catalog/inventory_client.py. Deliberately no
      # `depends_on: inventory` for this, same reasoning as Orders' own
      # lack of one: Catalog should boot and serve fine even if Inventory
      # is briefly unavailable, this call just 503s in that case.
      INVENTORY_BASE_URL: http://inventory:8000
      INVENTORY_TIMEOUT_SECONDS: "5.0"
    volumes:
      # Live bind mount, see auth-backend's for why only these subpaths.
      - ./services/catalog/src:/app/src
      - ./services/catalog/migrations:/app/migrations
      - ./services/catalog/alembic.ini:/app/alembic.ini
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Not exposed on the host — only reachable through catalog-gate/nginx,
    # same as any other real domain service.

  # OPA policy sidecar for Catalog — centralizes the policy source of
  # truth (policies/*.rego) while keeping enforcement a localhost call, no
  # network hop to a shared auth service. network_mode: "service:catalog"
  # shares catalog's network namespace (true sidecar behavior locally,
  # mirroring a GKE pod's shared network namespace between containers) —
  # safe here since catalog itself publishes no host ports to collide with.
  catalog-opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr=:8181", "/policies/catalog.rego", "/policies/common.rego"]
    environment:
      # common.rego's `subject` rule verifies X-Internal-Token itself
      # (io.jwt.decode_verify) — must match catalog's own
      # INTERNAL_TOKEN_SECRET above (and auth-backend's, same shared
      # secret every service validates the Gateway-minted token against).
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
    volumes:
      - ./policies:/policies:ro
    network_mode: "service:catalog"
    depends_on:
      - catalog

  # Translates OPA's JSON decision into the HTTP status/headers
  # catalog-gate's auth_request needs — see internal_gate/main.py's own
  # comment for why this can't just be nginx config. Generic (no
  # catalog-specific code), parameterized by OPA_PACKAGE; one instance
  # per gated domain service.
  catalog-verify:
    build: ./services/internal-gate
    environment:
      PORT: "8090"
      OPA_URL: http://localhost:8181
      OPA_PACKAGE: catalog
    network_mode: "service:catalog"
    depends_on:
      - catalog-opa

  # Occupies :8000 -- the port every other service already calls
  # catalog:8000 at, so nothing outside this pod needs to know this
  # exists. GET (catalog's public read paths) passes straight through;
  # everything else goes through catalog-verify's OPA-backed check first.
  # See nginx/internal-gate/catalog.conf for the full auth_request wiring.
  catalog-gate:
    image: nginx:1.27-alpine
    command: ["nginx", "-c", "/etc/nginx-src/catalog.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx/internal-gate:/etc/nginx-src:ro
    network_mode: "service:catalog"
    depends_on:
      - catalog
      - catalog-verify

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory:
    build: ./services/inventory
    environment:
      # Not the network-facing port anymore -- inventory-gate (nginx)
      # below occupies :8000 (what every other service's InventoryClient
      # still calls, unchanged) and proxies here. HOST=127.0.0.1 means
      # this is unreachable from outside this pod's shared network
      # namespace even if something guesses the port.
      PORT: "8010"
      HOST: "127.0.0.1"
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@inventory-db:5432/inventory
      # Only used to mint this service's own outbound token when calling
      # Catalog (see catalog_client.py) -- must match auth-backend's
      # INTERNAL_TOKEN_SECRET, same as catalog.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Short dev/test values so the reservation-saga's expired-reservation
      # scenario (Pending -> Cancelled) is actually runnable locally in
      # under a minute, instead of only declared. Settings.py's own default
      # is a realistic 24h/60s for anywhere else this service runs. 300s
      # (5min) instead of the original 30s so manually clicking through
      # checkout -> pay in the admin/storefront UI doesn't race the expiry
      # checker — still short enough to demo the saga by just waiting.
      RESERVATION_TTL_SECONDS: "300"
      RESERVATION_CHECK_INTERVAL_SECONDS: "5"
      # For unpublishing a product once it hits zero stock everywhere (see
      # stock_sync.py) — same container-to-container bypass-nginx pattern
      # as Orders -> Catalog.
      CATALOG_BASE_URL: http://catalog:8000
      CATALOG_TIMEOUT_SECONDS: "5.0"
    volumes:
      # Live bind mount, see auth-backend's for why only these subpaths.
      - ./services/inventory/src:/app/src
      - ./services/inventory/migrations:/app/migrations
      - ./services/inventory/alembic.ini:/app/alembic.ini
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Not exposed on the host — only reachable through nginx, same as
    # catalog.

  # OPA policy sidecar for Inventory — see catalog-opa above for the
  # sidecar-vs-central-service rationale and the network_mode note. Wires
  # policies/inventory.rego's admin-only/identity-only split.
  inventory-opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr=:8181", "/policies/inventory.rego", "/policies/common.rego"]
    environment:
      # common.rego's `subject` rule verifies X-Internal-Token itself
      # (io.jwt.decode_verify) — must match inventory's own (removed)
      # INTERNAL_TOKEN_SECRET and every caller's minted-token secret.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
    volumes:
      - ./policies:/policies:ro
    network_mode: "service:inventory"
    depends_on:
      - inventory

  # Translates OPA's JSON decision into the HTTP status/headers
  # inventory-gate's auth_request needs — same generic image as
  # catalog-verify/security-verify/payments-verify, parameterized by
  # OPA_PACKAGE.
  inventory-verify:
    build: ./services/internal-gate
    environment:
      PORT: "8090"
      OPA_URL: http://localhost:8181
      OPA_PACKAGE: inventory
    network_mode: "service:inventory"
    depends_on:
      - inventory-opa

  # Occupies :8000 -- what every other service's InventoryClient still
  # calls. Three-tier split (public/identity-only/admin-only), see
  # nginx/internal-gate/inventory.conf.
  inventory-gate:
    image: nginx:1.27-alpine
    command: ["nginx", "-c", "/etc/nginx-src/inventory.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx/internal-gate:/etc/nginx-src:ro
    network_mode: "service:inventory"
    depends_on:
      - inventory
      - inventory-verify

  orders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes:
      - orders_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders:
    build: ./services/orders
    environment:
      # Not the network-facing port anymore -- orders-gate (nginx) below
      # occupies :8000 (what the external Gateway and stripe-cli below
      # still call, unchanged) and proxies here. HOST=127.0.0.1 means this
      # is unreachable from outside this pod's shared network namespace
      # even if something guesses the port.
      PORT: "8010"
      HOST: "127.0.0.1"
      DATABASE_URL: postgresql+asyncpg://orders:orders@orders-db:5432/orders
      # Container-to-container address on the compose network — bypasses
      # nginx for this one synchronous inter-service call (see
      # libs/contracts/inventory/check-availability.md).
      INVENTORY_BASE_URL: http://inventory:8000
      INVENTORY_TIMEOUT_SECONDS: "5.0"
      # Same pattern, for pricing Stripe PaymentIntents server-side (see
      # orders/routers/payments.py) — Orders keeps no price of its own.
      CATALOG_BASE_URL: http://catalog:8000
      CATALOG_TIMEOUT_SECONDS: "5.0"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_POLL_INTERVAL_SECONDS: "1.0"
      # Test-mode keys (sk_test_.../whsec_...) from your Stripe dashboard —
      # same ${VAR:-} passthrough-from-root-.env pattern as ai-assistant's
      # GCP_PROJECT below (STR-161b — was OPENAI_API_KEY before the Gemini
      # migration). Empty by default so the service still boots without
      # them (Stripe just 401s at call time, not at startup).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # STR-139: parallel Temporal-orchestrated /checkout/v2 — see
      # routers/checkout_v2.py and services/checkout-workflow.
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_TASK_QUEUE: checkout-workflow
      CHECKOUT_V2_WAIT_SECONDS: "10.0"
    volumes:
      # Live bind mount, see auth-backend's for why only these subpaths.
      - ./services/orders/src:/app/src
      - ./services/orders/migrations:/app/migrations
      - ./services/orders/alembic.ini:/app/alembic.ini
    depends_on:
      orders-db:
        condition: service_healthy
      # Deliberately no dependency on `inventory` — Orders should boot and
      # serve cart endpoints fine even if Inventory is briefly unavailable;
      # checkout correctly 503s in that case instead of the whole service
      # failing to start. Kafka is now a real dependency: the reservation
      # saga (this ticket) needs the broker up for both the outbox worker
      # and the inventory-events consumer to start cleanly.
      kafka:
        condition: service_healthy
      # Same best-effort reasoning as inventory/kafka above, applied to
      # Temporal — temporal has no compose healthcheck of its own (see its
      # service block), so service_started is all there is to depend on;
      # /checkout/v2 just 503s if it's not actually ready yet.
      temporal:
        condition: service_started
    # Not exposed on the host — only reachable through nginx, same as
    # catalog/inventory.

  # OPA policy sidecar for Orders — see catalog-opa above for the
  # sidecar-vs-central-service rationale and the network_mode note. Wires
  # orders-verify's route-level gate tiers (admin-only/admin-or-assistant/
  # any-authenticated) -- policies/checkout.rego was merged into this one
  # package when that route-level gating moved out of the app. The
  # GET /orders/{id} resource-ownership check (order.owner_id == caller's
  # sub) is a plain comparison orders' own code makes inline, not an OPA
  # query -- see routers/orders.py's get_order.
  orders-opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr=:8181", "/policies/orders.rego", "/policies/common.rego"]
    environment:
      # common.rego's `subject` rule verifies X-Internal-Token itself
      # (io.jwt.decode_verify) — must match every caller's minted-token
      # secret. Orders itself no longer has its own INTERNAL_TOKEN_SECRET
      # (removed along with jwt.decode() -- see orders/auth.py).
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
    volumes:
      - ./policies:/policies:ro
    network_mode: "service:orders"
    depends_on:
      - orders

  # Translates OPA's JSON decision into the HTTP status/headers
  # orders-gate's auth_request needs — same generic image as
  # catalog-verify/security-verify/payments-verify/inventory-verify,
  # parameterized by OPA_PACKAGE.
  orders-verify:
    build: ./services/internal-gate
    environment:
      PORT: "8090"
      OPA_URL: http://localhost:8181
      OPA_PACKAGE: orders
    network_mode: "service:orders"
    depends_on:
      - orders-opa

  # Occupies :8000 -- what the external Gateway and stripe-cli below still
  # call. Three-tier split (public/admin/admin-or-assistant/any-
  # authenticated), see nginx/internal-gate/orders.conf. Unlike
  # catalog/security/payments/inventory, orders' own code still forwards
  # X-User-Id/X-User-Role for business logic that genuinely needs identity
  # (own cart, own orders) -- this gate only stops it from having to
  # verify that identity itself.
  orders-gate:
    image: nginx:1.27-alpine
    command: ["nginx", "-c", "/etc/nginx-src/orders.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx/internal-gate:/etc/nginx-src:ro
    network_mode: "service:orders"
    depends_on:
      - orders
      - orders-verify

  # Forwards Stripe test-mode webhook events straight to the orders
  # container (bypassing nginx/TLS entirely -- no cert-trust issues to
  # fight for a container-to-container call) so payment_intent.succeeded
  # reaches POST /webhooks/stripe without you having to babysit a `stripe
  # listen` terminal. `docker compose up -d` keeps this running
  # continuously (restart: unless-stopped), so the whsec_... it prints
  # stays valid for as long as this container itself doesn't restart --
  # grab it once from `docker compose logs -f stripe-cli`, put it in
  # STRIPE_WEBHOOK_SECRET in .env, restart `orders` once, and you're done.
  # A host reboot / `docker compose restart stripe-cli` mints a new one,
  # same as restarting the CLI manually would.
  stripe-cli:
    image: stripe/stripe-cli:latest
    restart: unless-stopped
    command: listen --api-key ${STRIPE_SECRET_KEY:-} --forward-to http://orders:8000/webhooks/stripe
    # orders-gate (not orders itself, see above) has no healthcheck
    # defined, so service_started (not service_healthy) is all that's
    # available to depend on here. It's what actually owns :8000 now.
    depends_on:
      orders-gate:
        condition: service_started

  # --- STR-139: Temporal orchestration for checkout, parallel to Orders'
  # Kafka-choreographed saga above (this does not replace it). ---

  temporal-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dedicated `temporal` database on this same Postgres instance, separate
  # from every domain service's own database — Temporal owns its workflow
  # event history, nothing else should ever read/write it directly. On
  # GCP this is Cloud SQL; auto-setup handles running Temporal's own schema
  # migrations against it on boot (a GKE deployment would use `temporal
  # sql-tool` / server-side schema setup once instead, per Temporal's own
  # production docs — auto-setup is dev-only).
  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    depends_on:
      temporal-db:
        condition: service_healthy
    # No host port and no compose healthcheck (auto-setup's own startup
    # migration means there's no cheap liveness probe worth scripting here)
    # — not exposed on the host, only reachable from other containers on
    # the compose network (the worker, and Orders' Temporal client), same
    # "internal only" treatment as catalog/inventory/orders.

  # Debugging/demo UI, explicitly NOT routed through nginx — same
  # treatment as MinIO's console and Mailpit's web UI (STR-139's confirmed
  # decision): a raw published host port, not an authenticated Gateway
  # location, since this is a dev-only operator tool, not a browser-facing
  # domain service.
  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8088:8080"
    depends_on:
      - temporal

  payments-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    volumes:
      - payments_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  payments:
    build: ./services/payments
    environment:
      # Not the network-facing port anymore -- payments-gate (nginx)
      # below occupies :8000 (what checkout-workflow's PAYMENTS_BASE_URL
      # still calls, unchanged) and proxies here. HOST=127.0.0.1 means
      # this is unreachable from outside this pod's shared network
      # namespace even if something guesses the port.
      PORT: "8010"
      HOST: "127.0.0.1"
      DATABASE_URL: postgresql+asyncpg://payments:payments@payments-db:5432/payments
      # See payments/config.py — an amount ending in this suffix simulates
      # a declined charge, for saga testing (no real payment gateway here).
      PAYMENT_FAIL_ON_AMOUNT_SUFFIX: "99"
    volumes:
      # Live bind mount, see auth-backend's for why only these subpaths.
      - ./services/payments/src:/app/src
      - ./services/payments/migrations:/app/migrations
      - ./services/payments/alembic.ini:/app/alembic.ini
    depends_on:
      payments-db:
        condition: service_healthy
    # Not exposed on the host, and deliberately not routed through nginx —
    # Payments is called only by checkout-workflow's Temporal activities
    # over the compose network, never directly by the browser. Same
    # treatment as ai-assistant/mcp-gateway.

  # OPA policy sidecar for Payments — see catalog-opa above for the
  # sidecar-vs-central-service rationale and the network_mode note. Wires
  # the check_permission() stub STR-139 left in routers/payments.py.
  payments-opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr=:8181", "/policies/payments.rego", "/policies/common.rego"]
    environment:
      # common.rego's `subject` rule verifies X-Internal-Token itself
      # (io.jwt.decode_verify) — must match payments' own (removed)
      # INTERNAL_TOKEN_SECRET and checkout-workflow's minted-token secret.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
    volumes:
      - ./policies:/policies:ro
    network_mode: "service:payments"
    depends_on:
      - payments

  # Translates OPA's JSON decision into the HTTP status/headers
  # payments-gate's auth_request needs — same generic image as
  # catalog-verify/security-verify, parameterized by OPA_PACKAGE.
  payments-verify:
    build: ./services/internal-gate
    environment:
      PORT: "8090"
      OPA_URL: http://localhost:8181
      OPA_PACKAGE: payments
    network_mode: "service:payments"
    depends_on:
      - payments-opa

  # Occupies :8000 -- what checkout-workflow's PAYMENTS_BASE_URL still
  # calls. Every route is admin-only (no browser-facing endpoint at all),
  # so only /health is exempted. See nginx/internal-gate/payments.conf.
  payments-gate:
    image: nginx:1.27-alpine
    command: ["nginx", "-c", "/etc/nginx-src/payments.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx/internal-gate:/etc/nginx-src:ro
    network_mode: "service:payments"
    depends_on:
      - payments
      - payments-verify

  # Pure Temporal task-queue poller — no FastAPI app, no host port. Its own
  # container/deployment (not co-located with Orders) so it's independently
  # killable/restartable, per STR-139's confirmed decision and the ticket's
  # own "kill the worker mid-workflow, confirm it resumes" verification
  # step.
  checkout-workflow-worker:
    build: ./services/checkout-workflow
    environment:
      TEMPORAL_HOST: temporal:7233
      TASK_QUEUE: checkout-workflow
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      INVENTORY_BASE_URL: http://inventory:8000
      INVENTORY_TIMEOUT_SECONDS: "5.0"
      ORDERS_BASE_URL: http://orders:8000
      ORDERS_TIMEOUT_SECONDS: "5.0"
      PAYMENTS_BASE_URL: http://payments:8000
      PAYMENTS_TIMEOUT_SECONDS: "5.0"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ESCALATION_ATTEMPT_THRESHOLD: "10"
    volumes:
      - ./services/checkout-workflow/src:/app/src
    depends_on:
      # Best-effort on every peer, same reasoning as orders/inventory
      # elsewhere in this file — none of these are service_healthy since
      # temporal itself has no healthcheck to depend on (see above); a
      # workflow task just retries (Temporal's own activity retry policy)
      # until its target is actually reachable.
      temporal:
        condition: service_started
      payments:
        condition: service_started
      inventory:
        condition: service_started
      orders:
        condition: service_started
      kafka:
        condition: service_healthy

  telemetry-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    volumes:
      - telemetry_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  telemetry:
    build: ./services/telemetry
    environment:
      # Not the network-facing port anymore -- telemetry-gate (nginx)
      # below occupies :8000 (what the external Gateway and
      # telemetry-simulator below still call, unchanged) and proxies
      # here. HOST=127.0.0.1 means this is unreachable from outside this
      # pod's shared network namespace even if something guesses the
      # port.
      PORT: "8010"
      HOST: "127.0.0.1"
      DATABASE_URL: postgresql+asyncpg://telemetry:telemetry@telemetry-db:5432/telemetry
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Short dev/test values so test-telemetry-saga.sh doesn't have to wait
      # a full 5 minutes for a detection cycle or a real hour for the
      # sustained-violation window — same pattern as inventory's
      # RESERVATION_TTL_SECONDS/RESERVATION_CHECK_INTERVAL_SECONDS.
      # Settings.py's own defaults are the realistic 300s/3600s for
      # anywhere else this service runs.
      VIOLATION_CHECK_INTERVAL_SECONDS: "5"
      VIOLATION_WINDOW_SECONDS: "20"
    volumes:
      # Live bind mount, see auth-backend's for why only these subpaths.
      - ./services/telemetry/src:/app/src
      - ./services/telemetry/migrations:/app/migrations
      - ./services/telemetry/alembic.ini:/app/alembic.ini
    depends_on:
      telemetry-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Not exposed on the host — only reachable through nginx, same as
    # catalog/inventory/orders.

  # OPA policy sidecar for Telemetry — see catalog-opa above for the
  # sidecar-vs-central-service rationale and the network_mode note. Wires
  # the admin-only baseline every gated route here uses (see
  # policies/telemetry.rego).
  telemetry-opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr=:8181", "/policies/telemetry.rego", "/policies/common.rego"]
    environment:
      # common.rego's `subject` rule verifies X-Internal-Token itself
      # (io.jwt.decode_verify) — must match auth-backend's
      # INTERNAL_TOKEN_SECRET. Telemetry itself no longer has its own copy
      # (removed along with jwt.decode() -- see the now-deleted
      # telemetry/auth.py).
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
    volumes:
      - ./policies:/policies:ro
    network_mode: "service:telemetry"
    depends_on:
      - telemetry

  # Translates OPA's JSON decision into the HTTP status/headers
  # telemetry-gate's auth_request needs — same generic image as every
  # other domain service's *-verify, parameterized by OPA_PACKAGE.
  telemetry-verify:
    build: ./services/internal-gate
    environment:
      PORT: "8090"
      OPA_URL: http://localhost:8181
      OPA_PACKAGE: telemetry
    network_mode: "service:telemetry"
    depends_on:
      - telemetry-opa

  # Occupies :8000 -- what the external Gateway and telemetry-simulator
  # below still call. Simplest split in this repo: everything is
  # admin-only except GET /stores, POST /measurements, and /health. See
  # nginx/internal-gate/telemetry.conf.
  telemetry-gate:
    image: nginx:1.27-alpine
    command: ["nginx", "-c", "/etc/nginx-src/telemetry.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx/internal-gate:/etc/nginx-src:ro
    network_mode: "service:telemetry"
    depends_on:
      - telemetry
      - telemetry-verify

  telemetry-simulator:
    build: ./services/telemetry/simulator
    environment:
      TELEMETRY_URL: http://telemetry:8000
      STORE_ID: 11111111-1111-1111-1111-111111111111
      BASE_TEMPERATURE: "4.0"
      TEMP_VARIANCE: "0.5"
      INTERVAL_SECONDS: "300"
    depends_on:
      # telemetry-gate (not telemetry itself, see above) is what actually
      # owns :8000 now. It has no compose healthcheck of its own, so
      # service_started is all there is to depend on.
      telemetry-gate:
        condition: service_started
    # Dev-only synthetic data source — not a real DHT22 sensor. See
    # docs/EVENT_BROKER.md's accepted-gaps section.

  # STR-147: CQRS read model for Telemetry — hourly aggregates, own
  # Postgres instance, no shared tables with telemetry-db. See
  # services/telemetry-aggregates/README.md.
  telemetry-aggregates-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemetry-aggregates
      POSTGRES_USER: telemetry-aggregates
      POSTGRES_PASSWORD: telemetry-aggregates
    volumes:
      - telemetry_aggregates_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry-aggregates"]
      interval: 5s
      timeout: 5s
      retries: 10

  telemetry-aggregates:
    build: ./services/telemetry-aggregates
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://telemetry-aggregates:telemetry-aggregates@telemetry-aggregates-db:5432/telemetry-aggregates
      # Must match auth-backend's INTERNAL_TOKEN_SECRET, same as telemetry.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      # Connects as telemetry_readonly (see telemetry's migration
      # 69ff8539f688, added during STR-148's live verification — the
      # connection was documented as "read-only in intent" but had never
      # actually been scoped to a role that can't write), not the
      # full-access `telemetry` user. GRANTed SELECT only on
      # temperature_readings/store_product_thresholds — the two tables
      # backfill.py reads. See README's "Backfill job" section.
      TELEMETRY_DB_URL: postgresql+asyncpg://telemetry_readonly:telemetry-readonly@telemetry-db:5432/telemetry
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Short dev/test value so scripts/test-telemetry-aggregates.sh doesn't
      # have to wait a real 15 minutes for a backfill cycle — same pattern
      # as telemetry's VIOLATION_CHECK_INTERVAL_SECONDS override.
      # Settings.py's own default (15) is the realistic value anywhere
      # else this service runs.
      BACKFILL_INTERVAL_MINUTES: "0.2"
    volumes:
      - ./services/telemetry-aggregates/src:/app/src
      - ./services/telemetry-aggregates/migrations:/app/migrations
      - ./services/telemetry-aggregates/alembic.ini:/app/alembic.ini
    depends_on:
      telemetry-aggregates-db:
        condition: service_healthy
      telemetry-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Not exposed on the host — only reachable through nginx, same as
    # telemetry.

  security-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security
      POSTGRES_USER: security
      POSTGRES_PASSWORD: security
    volumes:
      - security_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-camera:
    build: ./services/security/mock-camera
    # Internal-only: Security constructs video_url pointing at this
    # container's compose-network name; no host port needed unless
    # manually testing the mock feed directly.

  security:
    build: ./services/security
    environment:
      # Not the network-facing port anymore -- security-gate (nginx)
      # below occupies :8000 (what every other service still calls
      # security:8000, unchanged) and proxies here. HOST=127.0.0.1 means
      # this is unreachable from outside this pod's shared network
      # namespace even if something guesses the port.
      PORT: "8010"
      HOST: "127.0.0.1"
      DATABASE_URL: postgresql+asyncpg://security:security@security-db:5432/security
      CAMERA_BASE_URL: http://mock-camera:8001
    volumes:
      # Live bind mount, see auth-backend's for why only these subpaths.
      - ./services/security/src:/app/src
      - ./services/security/migrations:/app/migrations
      - ./services/security/alembic.ini:/app/alembic.ini
    depends_on:
      security-db:
        condition: service_healthy
    # No Kafka dependency — access control is synchronous by nature (a
    # door open/close decision can't wait on eventual consistency). See
    # docs/EVENT_BROKER.md and services/security/README.md.

  # OPA policy sidecar for Security — see catalog-opa above for the
  # sidecar-vs-central-service rationale and the network_mode note.
  security-opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr=:8181", "/policies/security.rego", "/policies/common.rego"]
    environment:
      # common.rego's `subject` rule verifies X-Internal-Token itself
      # (io.jwt.decode_verify) — must match security's own (removed)
      # INTERNAL_TOKEN_SECRET and auth-backend's, same shared secret every
      # service validates the Gateway-minted token against.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
    volumes:
      - ./policies:/policies:ro
    network_mode: "service:security"
    depends_on:
      - security

  # Translates OPA's JSON decision into the HTTP status/headers
  # security-gate's auth_request needs — same generic image as
  # catalog-verify, parameterized by OPA_PACKAGE. See
  # services/internal-gate/README.md.
  security-verify:
    build: ./services/internal-gate
    environment:
      PORT: "8090"
      OPA_URL: http://localhost:8181
      OPA_PACKAGE: security
    network_mode: "service:security"
    depends_on:
      - security-opa

  # Occupies :8000 -- the port every other service already calls
  # security:8000 at. /auth/* (hardware simulator) and /health pass
  # straight through; /users, /visit-log, /warehouses (including their
  # own GET routes) go through security-verify's OPA-backed check first.
  # See nginx/internal-gate/security.conf.
  security-gate:
    image: nginx:1.27-alpine
    command: ["nginx", "-c", "/etc/nginx-src/security.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx/internal-gate:/etc/nginx-src:ro
    network_mode: "service:security"
    depends_on:
      - security
      - security-verify

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      # Web UI + REST API only — exposed to the host so
      # scripts/test-notifications-saga.sh (and manual inspection) can
      # reach it. SMTP itself (1025) is deliberately NOT published to the
      # host: only notifications, on the compose network, sends mail.
      - "8025:8025"
    # Dev-only SMTP stub — see docs/EVENT_BROKER.md's accepted-gaps
    # section and services/notifications/README.md. Swap for a real
    # provider (SES/etc.) before any prod/AWS deploy.

  notifications:
    build: ./services/notifications
    environment:
      PORT: "8000"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    volumes:
      # Live bind mount, see auth-backend's for why only this subpath.
      - ./services/notifications/src:/app/src
    depends_on:
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Not exposed on the host, and deliberately not routed through nginx —
    # this service has no Gateway route and no synchronous callers, pure
    # Kafka consumer + SMTP sender. See services/notifications/README.md.

  chat-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Object storage is a real GCS bucket over its S3-compatible XML API in
  # every environment now, local dev included (there is no MinIO stand-in
  # anymore). catalog and chat share one bucket, isolated by the catalog/
  # and chat/ key prefixes. Provision with:
  #   gcloud storage buckets create gs://<name> --uniform-bucket-level-access \
  #     --public-access-prevention
  #   gcloud iam service-accounts create <sa>
  #   gcloud storage buckets add-iam-policy-binding gs://<name> \
  #     --member=serviceAccount:<sa-email> --role=roles/storage.objectAdmin
  #   gcloud storage hmac create <sa-email>
  # then put GCS_BUCKET / GCS_HMAC_ACCESS_KEY / GCS_HMAC_SECRET in the root
  # .env. Terraform equivalent: terraform/gcp/modules/storage.

  chat:
    build: ./services/chat
    environment:
      # Not the network-facing port anymore -- chat-gate (nginx) below
      # occupies :8000 (what the external Gateway's /ws/ and /api/chat/
      # locations still call, unchanged) and proxies here. HOST=127.0.0.1
      # means this is unreachable from outside this pod's shared network
      # namespace even if something guesses the port.
      PORT: "8010"
      HOST: "127.0.0.1"
      DATABASE_URL: postgresql+asyncpg://chat:chat@chat-db:5432/chat
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_POLL_INTERVAL_SECONDS: "1.0"
      # Shared with auth-backend — Redis pub/sub + presence sets live under
      # a chat:-prefixed key namespace, isolated from auth-backend's
      # guest_session: keys on the same instance.
      REDIS_URL: redis://redis:6379
      # Same GCS bucket as catalog, isolated by the chat/ key prefix — see
      # the comment above the (removed) object-storage service.
      OBJECT_STORAGE_ENDPOINT: https://storage.googleapis.com
      OBJECT_STORAGE_PUBLIC_BASE_URL: https://storage.googleapis.com
      OBJECT_STORAGE_ACCESS_KEY: ${GCS_HMAC_ACCESS_KEY:?set GCS_HMAC_ACCESS_KEY in .env}
      OBJECT_STORAGE_SECRET_KEY: ${GCS_HMAC_SECRET:?set GCS_HMAC_SECRET in .env}
      OBJECT_STORAGE_BUCKET: ${GCS_BUCKET:?set GCS_BUCKET in .env}
      OBJECT_STORAGE_KEY_PREFIX: chat/
      # STR-146: forwards a registered customer's own internal-token here on
      # every message, synchronously, so the shopping agent's ReAct loop has
      # a real per-customer identity to propagate into cart-mutating tool
      # calls — bypasses the chat-events Kafka topic, which has no token to
      # carry (see ai-assistant's own chat_events.py, guest-only now).
      AI_ASSISTANT_SERVICE_URL: http://ai-assistant:8000
    volumes:
      # Live bind mount, see auth-backend's for why only these subpaths.
      - ./services/chat/src:/app/src
      - ./services/chat/migrations:/app/migrations
      - ./services/chat/alembic.ini:/app/alembic.ini
    depends_on:
      chat-db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
    # Not exposed on the host — only reachable through nginx, same as
    # catalog/inventory/orders/telemetry/security. nginx's /ws/ and
    # /api/chat/ locations address this container as chat:8000 (now
    # chat-gate, see below).

  # OPA policy sidecar for Chat — see catalog-opa above for the
  # sidecar-vs-central-service rationale and the network_mode note. Wires
  # chat-verify's route-level gate tiers (admin/admin-or-assistant/
  # assistant/any-authenticated) -- room-ownership decisions stay inline
  # in chat's own code (see policies/chat.rego's comment).
  chat-opa:
    image: openpolicyagent/opa:latest
    command: ["run", "--server", "--addr=:8181", "/policies/chat.rego", "/policies/common.rego"]
    environment:
      # common.rego's `subject` rule verifies X-Internal-Token itself
      # (io.jwt.decode_verify) — must match auth-backend's
      # INTERNAL_TOKEN_SECRET. Chat itself no longer has its own copy
      # (removed along with jwt.decode() -- see chat/auth.py).
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
    volumes:
      - ./policies:/policies:ro
    network_mode: "service:chat"
    depends_on:
      - chat

  # Translates OPA's JSON decision into the HTTP status/headers
  # chat-gate's auth_request needs — same generic image as
  # catalog-verify/security-verify/payments-verify/inventory-verify/
  # orders-verify, parameterized by OPA_PACKAGE.
  chat-verify:
    build: ./services/internal-gate
    environment:
      PORT: "8090"
      OPA_URL: http://localhost:8181
      OPA_PACKAGE: chat
    network_mode: "service:chat"
    depends_on:
      - chat-opa

  # Occupies :8000 -- what the external Gateway's /ws/ and /api/chat/
  # locations still call. Handles both REST and the /ws/room/{id}
  # WebSocket handshake (auth_request works on it the same way, see
  # nginx/internal-gate/chat.conf's comment). Four-tier split (public/
  # admin/admin-or-assistant/assistant/any-authenticated).
  chat-gate:
    image: nginx:1.27-alpine
    command: ["nginx", "-c", "/etc/nginx-src/chat.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx/internal-gate:/etc/nginx-src:ro
    network_mode: "service:chat"
    depends_on:
      - chat
      - chat-verify

  ai-db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
    volumes:
      - ai_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-assistant:
    build: ./services/ai-assistant
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://ai:ai@ai-db:5432/ai
      # Must match auth-backend's INTERNAL_TOKEN_SECRET, same as every other
      # domain service — this service mints its own internal token from it
      # (see services/ai-assistant/src/ai_assistant/auth.py) since it's
      # triggered by Kafka events, not incoming HTTP requests, so there's no
      # request token to forward.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379
      # Container-to-container address — bypasses nginx for this internal
      # call, same as Orders -> Inventory. (Order data now reaches the agents
      # only as MCP tools via mcp-gateway; this service no longer calls
      # Orders directly.)
      CHAT_SERVICE_URL: http://chat:8000
      # STR-161b: replaces OPENAI_API_KEY — Gemini via the Gemini Enterprise
      # Agent Platform authenticates with IAM/Workload Identity, not an API
      # key, so there's no ${VAR:-} secret passthrough here anymore. Local
      # (non-GKE) dev has no Workload Identity though: this container needs
      # real Application Default Credentials to actually reach Gemini — run
      # `gcloud auth application-default login` on the host and mount
      # ~/.config/gcloud into the container, or set
      # GOOGLE_APPLICATION_CREDENTIALS to a service-account key file. See
      # README's "Dev gaps" (same class of trade-off as the old
      # OPENAI_API_KEY requirement — no local LLM fallback either way).
      GCP_PROJECT: ${GCP_PROJECT:-internstore-dev}
      # Pin the Vertex region so a quota increase lands where the traffic
      # goes (the "global" endpoint spreads requests across regions, so a
      # per-region quota bump wouldn't reliably help). Must match mcp-gateway.
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      # Local dev: authenticate to Vertex with the host's Application
      # Default Credentials (gcloud auth application-default login), mounted
      # read-only below. In GKE this is Workload Identity instead and this
      # var/mount is absent.
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
      # Matches config.py's default; override per-env via root .env if a
      # newer Vertex model is preferred. Same ${VAR:-} passthrough.
      CHAT_MODEL: ${CHAT_MODEL:-gemini-2.5-flash}
      AI_MODE_DEFAULT: ai
      AI_RATE_LIMIT: "10"
      # Cross-session memory adds several Gemini embedding calls per shopping
      # turn. The local Vertex project's gemini-embedding quota is tiny, and
      # search_products needs that quota for every query — so it's off here.
      # Flip to "true" once the quota is raised to demo the memory feature.
      MEMORY_ENABLED: "false"
      # The ADK agents reach every tool over the real MCP protocol here
      # (adk/agents.py -> McpToolset -> http://mcp-gateway:8000/mcp).
      MCP_GATEWAY_URL: http://mcp-gateway:8000
      # Refreshes the customer's internal-token when it's near its 60s TTL —
      # the McpToolset header provider calls it (adk/token_context.py).
      AUTH_BACKEND_URL: http://auth-backend:3000
    volumes:
      # Live bind mount, see auth-backend's for why only these subpaths.
      - ./services/ai-assistant/src:/app/src
      - ./services/ai-assistant/migrations:/app/migrations
      - ./services/ai-assistant/help:/app/help
      - ./services/ai-assistant/alembic.ini:/app/alembic.ini
      # Host ADC for Vertex auth (local dev only) — see GOOGLE_APPLICATION_CREDENTIALS above.
      - ${HOME}/.config/gcloud:/gcloud:ro
    depends_on:
      ai-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    # No nginx route and not in nginx's depends_on below — internal only,
    # never called directly by the browser. See docs/EVENT_BROKER.md.

  # Exposes Orders/Inventory/Catalog/Telemetry/Security/Chat as MCP tools
  # over HTTP, so any MCP-compatible agent (starting with AI Assistant) can
  # call one registry instead of hand-rolling a client per domain service.
  # See services/mcp-gateway/README.md for the tool catalog.
  mcp-gateway:
    build: ./services/mcp-gateway
    environment:
      PORT: "8000"
      # Must match auth-backend's INTERNAL_TOKEN_SECRET, same as every
      # other domain service — this service mints its own admin-role
      # internal token for outbound calls (see
      # services/mcp-gateway/src/mcp_gateway/auth.py), same pattern as
      # ai-assistant's, since a single MCP tool call fans out to whichever
      # domain service holds the data rather than forwarding a caller's own
      # token.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      ORDERS_SERVICE_URL: http://orders:8000
      INVENTORY_SERVICE_URL: http://inventory:8000
      CATALOG_SERVICE_URL: http://catalog:8000
      TELEMETRY_SERVICE_URL: http://telemetry:8000
      SECURITY_SERVICE_URL: http://security:8000
      CHAT_SERVICE_URL: http://chat:8000
      # search_products queries ai-assistant's own pgvector table directly
      # (see src/mcp_gateway/models.py) rather than adding a public HTTP
      # endpoint to ai-assistant just for this.
      AI_DB_URL: postgresql+asyncpg://ai:ai@ai-db:5432/ai
      # STR-161b: see ai-assistant's own comment above — same IAM/Workload
      # Identity auth, same local-dev ADC requirement, must match
      # ai-assistant's GCP_PROJECT (both embed into the same pgvector index).
      GCP_PROJECT: ${GCP_PROJECT:-internstore-dev}
      # Same Vertex region as ai-assistant — see its comment. search_products
      # embeds the query here, so it draws on the same per-region quota.
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      # Local dev: Vertex auth via the host's ADC, mounted read-only below
      # (Workload Identity in GKE instead). Must be the same project as
      # ai-assistant.
      GOOGLE_APPLICATION_CREDENTIALS: /gcloud/application_default_credentials.json
      # Phase 3 — the public MCP door. This service runs a small OAuth 2.1
      # Authorization Server (src/mcp_gateway/oauth/) whose issuer is the
      # external nginx Gateway; the `/authorize` step federates identity to
      # the Firebase Auth emulator.
      # Override with an ngrok/cloudflared origin to connect the public door
      # to a cloud client (claude.ai): PUBLIC_BASE_URL / PUBLIC_MCP_URL must
      # match the origin the client actually sees (RFC 8414/9728), or the
      # OAuth discovery -> token flow fails.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost:8443}
      PUBLIC_MCP_URL: ${PUBLIC_MCP_URL:-https://localhost:8443/mcp}
      FIREBASE_IDENTITY_TOOLKIT_URL: http://firebase-emulator:9099/identitytoolkit.googleapis.com
      FIREBASE_WEB_API_KEY: fake-api-key
    volumes:
      # Live bind mount, see auth-backend's for why only this subpath.
      - ./services/mcp-gateway/src:/app/src
      - ${HOME}/.config/gcloud:/gcloud:ro
    depends_on:
      ai-db:
        condition: service_healthy
      firebase-emulator:
        condition: service_healthy
      orders:
        condition: service_started
      inventory:
        condition: service_started
      catalog:
        condition: service_started
      telemetry:
        condition: service_started
      security:
        condition: service_started
      chat:
        condition: service_started
    # Two doors: the in-mesh `/mcp` (X-Internal-Token, the ADK agents) has no
    # nginx route; the public OAuth door IS routed — see nginx/nginx.conf's
    # `/mcp` + `/authorize` &c. locations.

  frontend:
    build: ./frontend
    environment:
      # Baked into the Vite bundle at dev-server start (vite.config.ts's
      # `loadEnv` -> `define`), same values as frontend/.env. Client-side
      # code, so these must be host-reachable URLs (localhost, not
      # container names) — the browser runs on the host, not inside the
      # compose network.
      #
      # Origin-relative by default: nginx now serves the SPA at `/` too
      # (nginx.conf's catch-all `location /`), so the browser loads the app
      # and calls `/api/` on the SAME origin — works identically whether
      # that origin is https://localhost:8443 or an ngrok tunnel, with no
      # rebuild. Override with a full URL only if you serve the SPA straight
      # off :5180 and want it to reach a different API host.
      VITE_SERVER_URL: ${VITE_SERVER_URL:-/api/}
      # Hosts the Vite 6 dev server will answer for when reached through a
      # proxy/tunnel (it rejects unknown Host headers otherwise). The
      # leading dot on ".ngrok-free.dev" covers any ngrok subdomain.
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost,.ngrok-free.dev,.ngrok.io}
      # HMR's websocket can't infer the public port behind a proxy, so it's
      # off for the containerised setup (edits still recompile; the browser
      # just needs a manual refresh). Set to "false" for hot reload when you
      # hit :5180 directly.
      VITE_DISABLE_HMR: ${VITE_DISABLE_HMR:-true}
      # Firebase Auth emulator, same project id as firebase-emulator's
      # --project flag below and scripts/seed-firebase-users.py's default.
      # No VITE_FIREBASE_API_KEY here — the emulator accepts any non-empty
      # key (see src/services/firebase/client.ts's fallback).
      VITE_FIREBASE_PROJECT_ID: internstore-dev
      # "origin" -> the SDK talks to the emulator through the page's own
      # origin (nginx routes /identitytoolkit.googleapis.com/ &c. to
      # firebase-emulator:9099), so sign-in works both locally and for a
      # remote browser hitting the tunnel. Set to "localhost:9099" to go
      # straight to the emulator instead (only reachable on this host).
      VITE_FIREBASE_AUTH_EMULATOR_HOST: ${VITE_FIREBASE_AUTH_EMULATOR_HOST:-origin}
      # Publishable key (pk_test_...) -- safe to ship to the browser by
      # design (Stripe Elements needs it client-side to mount the card
      # form), unlike STRIPE_SECRET_KEY/STRIPE_WEBHOOK_SECRET below which
      # stay server-side on orders. Same ${VAR:-} root-.env passthrough as
      # those.
      VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
    volumes:
      # Live bind mount so source edits hot-reload via Vite's own file
      # watcher without a rebuild. The anonymous volume on node_modules
      # keeps the container's own `npm ci` install in place instead of
      # being shadowed by the host's (which may not exist, or be built for
      # a different platform).
      - ./frontend:/app
      - /app/node_modules
    ports:
      # :5173/:3000 (the frontend's conventional dev port / Next.js
      # default) were already taken by other things on this host, so this
      # container publishes on :5180 instead — registered on nginx's CORS
      # allowlist (see nginx/nginx.conf's $cors_origin map). Pick a free
      # port and update that if :5180 also collides on your machine.
      - "5180:5180"
    depends_on:
      - nginx

  nginx:
    build: ./nginx
    ports:
      - "8082:8080"
      - "8443:8443"
    volumes:
      # Persists the self-signed dev cert across `docker compose up --build
      # nginx` — docker-entrypoint-certs.sh only regenerates it if missing.
      # Without this, every nginx rebuild mints a brand new cert and
      # invalidates whatever "accept the risk" exception you'd already
      # granted it in the browser, which then fails silently and looks
      # exactly like a CORS error (see frontend/README's TLS note).
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - auth-backend
      - catalog
      - inventory
      - orders
      - telemetry
      - telemetry-aggregates
      - security
      - chat
      # Phase 3: the public MCP door (/api/mcp) proxies here.
      - mcp-gateway

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      # Internal Docker network path (kafka:9092) for other containers;
      # localhost:29092 for host-side tools/tests.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Fixed so the single node always rejoins the same KRaft cluster
      # across restarts instead of generating a new random ID each boot.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-topic-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # ai-assistant consumes catalog-events and chat-events (both
        # already listed below); it produces nothing itself, so there's no
        # separate ai-assistant-events topic to create.
        # ops-events (STR-139): checkout-workflow's release_stock activity
        # publishes EscalationRequired here once compensation retries are
        # exhausted; Notifications consumes it for the admin alert. See
        # docs/EVENT_BROKER.md.
        for topic in order-events inventory-events telemetry-events catalog-events chat-events ops-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done

volumes:
  catalog_db_data:
  inventory_db_data:
  orders_db_data:
  telemetry_db_data:
  telemetry_aggregates_db_data:
  security_db_data:
  chat_db_data:
  ai_db_data:
  payments_db_data:
  temporal_db_data:
  kafka_data:
  nginx_certs:
