services:
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Pins the `iss` claim on issued tokens to the externally-reachable
      # URL, regardless of which Host header a client used to reach us.
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  gateway:
    build: ./services/gateway
    environment:
      PORT: "3000"
      # Must match Keycloak's KC_HOSTNAME-pinned `iss` claim exactly.
      KEYCLOAK_ISSUER: http://localhost:8081/realms/internstore
      # Internal Docker network path — faster, and JWKS content doesn't
      # depend on which hostname you fetch it from.
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/internstore/protocol/openid-connect/certs
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      INTERNAL_TOKEN_TTL_SECONDS: "60"
    ports:
      - "3000:3000"
    depends_on:
      - keycloak

volumes:
  keycloak_db_data:
