services:
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Pins the `iss` claim on issued tokens to the externally-reachable
      # URL, regardless of which Host header a client used to reach us.
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth-backend:
    build: ./services/auth-backend
    environment:
      PORT: "3000"
      # Must match Keycloak's KC_HOSTNAME-pinned `iss` claim exactly.
      KEYCLOAK_ISSUER: http://localhost:8081/realms/internstore
      # Internal Docker network path — faster, and JWKS content doesn't
      # depend on which hostname you fetch it from.
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/internstore/protocol/openid-connect/certs
      # Used for AUTH-05 token introspection (see auth/revocation.py) —
      # matches the confidential client in keycloak/realm-export.json
      # (internstore-web is public and has no secret, so it can't
      # authenticate an introspection call).
      KEYCLOAK_CLIENT_ID: internstore-backend
      KEYCLOAK_CLIENT_SECRET: dev-only-keycloak-client-secret-change-me
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      INTERNAL_TOKEN_TTL_SECONDS: "60"
      REDIS_URL: redis://redis:6379
    ports:
      # Exposed directly too, for testing /me and /auth/verify without
      # going through nginx (see scripts/test-auth-flows.sh).
      - "3000:3000"
    depends_on:
      - keycloak
      - redis

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog:
    build: ./services/catalog
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://catalog:catalog@catalog-db:5432/catalog
      # Must match auth-backend's INTERNAL_TOKEN_SECRET — this is the
      # shared secret every internal service validates the Gateway-minted
      # token against, without calling back to auth-backend or Keycloak.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Product image storage — same MinIO instance as Chat's attachments,
      # its own bucket. See services/catalog/src/catalog/minio_client.py.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_BASE_URL: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: catalog-product-images
    depends_on:
      catalog-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Not exposed on the host — only reachable through nginx, same as any
    # other real domain service.

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory:
    build: ./services/inventory
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@inventory-db:5432/inventory
      # Must match auth-backend's INTERNAL_TOKEN_SECRET, same as catalog.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Short dev/test values so the reservation-saga's expired-reservation
      # scenario (Pending -> Cancelled) is actually runnable locally in
      # under a minute, instead of only declared. Settings.py's own default
      # is a realistic 24h/60s for anywhere else this service runs. 300s
      # (5min) instead of the original 30s so manually clicking through
      # checkout -> pay in the admin/storefront UI doesn't race the expiry
      # checker — still short enough to demo the saga by just waiting.
      RESERVATION_TTL_SECONDS: "300"
      RESERVATION_CHECK_INTERVAL_SECONDS: "5"
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Not exposed on the host — only reachable through nginx, same as
    # catalog.

  orders-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    volumes:
      - orders_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders:
    build: ./services/orders
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://orders:orders@orders-db:5432/orders
      # Must match auth-backend's INTERNAL_TOKEN_SECRET, same as catalog/inventory.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      # Container-to-container address on the compose network — bypasses
      # nginx for this one synchronous inter-service call (see
      # libs/contracts/inventory/check-availability.md).
      INVENTORY_BASE_URL: http://inventory:8000
      INVENTORY_TIMEOUT_SECONDS: "5.0"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_POLL_INTERVAL_SECONDS: "1.0"
    depends_on:
      orders-db:
        condition: service_healthy
      # Deliberately no dependency on `inventory` — Orders should boot and
      # serve cart endpoints fine even if Inventory is briefly unavailable;
      # checkout correctly 503s in that case instead of the whole service
      # failing to start. Kafka is now a real dependency: the reservation
      # saga (this ticket) needs the broker up for both the outbox worker
      # and the inventory-events consumer to start cleanly.
      kafka:
        condition: service_healthy
    # Not exposed on the host — only reachable through nginx, same as
    # catalog/inventory.

  telemetry-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    volumes:
      - telemetry_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry"]
      interval: 5s
      timeout: 5s
      retries: 10

  telemetry:
    build: ./services/telemetry
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://telemetry:telemetry@telemetry-db:5432/telemetry
      # Must match auth-backend's INTERNAL_TOKEN_SECRET, same as catalog/inventory.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Short dev/test values so test-telemetry-saga.sh doesn't have to wait
      # a full 5 minutes for a detection cycle or a real hour for the
      # sustained-violation window — same pattern as inventory's
      # RESERVATION_TTL_SECONDS/RESERVATION_CHECK_INTERVAL_SECONDS.
      # Settings.py's own defaults are the realistic 300s/3600s for
      # anywhere else this service runs.
      VIOLATION_CHECK_INTERVAL_SECONDS: "5"
      VIOLATION_WINDOW_SECONDS: "20"
    depends_on:
      telemetry-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # Not exposed on the host — only reachable through nginx, same as
    # catalog/inventory/orders.

  telemetry-simulator:
    build: ./services/telemetry/simulator
    environment:
      TELEMETRY_URL: http://telemetry:8000
      STORE_ID: 11111111-1111-1111-1111-111111111111
      BASE_TEMPERATURE: "4.0"
      TEMP_VARIANCE: "0.5"
      INTERVAL_SECONDS: "300"
    depends_on:
      telemetry:
        condition: service_started
    # Dev-only synthetic data source — not a real DHT22 sensor. See
    # docs/EVENT_BROKER.md's accepted-gaps section.

  security-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: security
      POSTGRES_USER: security
      POSTGRES_PASSWORD: security
    volumes:
      - security_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security"]
      interval: 5s
      timeout: 5s
      retries: 10

  mock-camera:
    build: ./services/security/mock-camera
    # Internal-only: Security constructs video_url pointing at this
    # container's compose-network name; no host port needed unless
    # manually testing the mock feed directly.

  security:
    build: ./services/security
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://security:security@security-db:5432/security
      # Must match auth-backend's INTERNAL_TOKEN_SECRET, same as every
      # other domain service.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      CAMERA_BASE_URL: http://mock-camera:8001
    depends_on:
      security-db:
        condition: service_healthy
    # No Kafka dependency — access control is synchronous by nature (a
    # door open/close decision can't wait on eventual consistency). See
    # docs/EVENT_BROKER.md and services/security/README.md.

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      # Web UI + REST API only — exposed to the host so
      # scripts/test-notifications-saga.sh (and manual inspection) can
      # reach it. SMTP itself (1025) is deliberately NOT published to the
      # host: only notifications, on the compose network, sends mail.
      - "8025:8025"
    # Dev-only SMTP stub — see docs/EVENT_BROKER.md's accepted-gaps
    # section and services/notifications/README.md. Swap for a real
    # provider (SES/etc.) before any prod/AWS deploy.

  notifications:
    build: ./services/notifications
    environment:
      PORT: "8000"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    # Not exposed on the host, and deliberately not routed through nginx —
    # this service has no Gateway route and no synchronous callers, pure
    # Kafka consumer + SMTP sender. See services/notifications/README.md.

  chat-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      # Both exposed to the host: 9000 is the S3 API — chat's
      # MINIO_PUBLIC_BASE_URL points a browser at this directly so it can
      # load attachment_url images (documented dev gap, see
      # services/chat/README.md — a real S3/CloudFront/signed-URL setup
      # replaces this in prod). 9001 is the web console, for manual
      # inspection only.
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/chat-attachments &&
        mc anonymous set download local/chat-attachments &&
        mc mb --ignore-existing local/catalog-product-images &&
        mc anonymous set download local/catalog-product-images
    # One-shot: creates the chat-attachments and catalog-product-images
    # buckets and makes them public-read within the docker network (per
    # the ticket) — mirrors kafka-topic-init's one-shot-provisioning-sidecar
    # pattern.

  chat:
    build: ./services/chat
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://chat:chat@chat-db:5432/chat
      # Must match auth-backend's INTERNAL_TOKEN_SECRET, same as every
      # other domain service.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_POLL_INTERVAL_SECONDS: "1.0"
      # Shared with auth-backend — Redis pub/sub + presence sets live under
      # a chat:-prefixed key namespace, isolated from auth-backend's
      # guest_session: keys on the same instance.
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_BASE_URL: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: chat-attachments
    depends_on:
      chat-db:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    # Not exposed on the host — only reachable through nginx, same as
    # catalog/inventory/orders/telemetry/security. nginx's /ws/ and
    # /api/chat/ locations address this container as chat:8000.

  ai-db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
    volumes:
      - ai_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-assistant:
    build: ./services/ai-assistant
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://ai:ai@ai-db:5432/ai
      # Must match auth-backend's INTERNAL_TOKEN_SECRET, same as every other
      # domain service — this service mints its own internal token from it
      # (see services/ai-assistant/src/ai_assistant/auth.py) since it's
      # triggered by Kafka events, not incoming HTTP requests, so there's no
      # request token to forward.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379
      # Container-to-container addresses — bypasses nginx for these internal
      # calls, same as Orders -> Inventory.
      CHAT_SERVICE_URL: http://chat:8000
      ORDERS_SERVICE_URL: http://orders:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODE_DEFAULT: ai
      AI_RATE_LIMIT: "10"
    depends_on:
      ai-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    # No nginx route and not in nginx's depends_on below — internal only,
    # never called directly by the browser. See docs/EVENT_BROKER.md.

  frontend:
    build: ./frontend
    environment:
      # Baked into the Vite bundle at dev-server start (vite.config.ts's
      # `loadEnv` -> `define`), same values as frontend/.env. Client-side
      # code, so these must be host-reachable URLs (localhost, not
      # container names) — the browser runs on the host, not inside the
      # compose network.
      VITE_SERVER_URL: https://localhost:8443/api/
      VITE_KEYCLOAK_URL: http://localhost:8081
      VITE_KEYCLOAK_REALM: internstore
      VITE_KEYCLOAK_CLIENT_ID: internstore-web
    ports:
      # :5173/:3000 (the frontend's conventional dev port / Next.js
      # default) were already taken by other things on this host, so this
      # container publishes on :5180 instead — registered as an extra
      # redirectUri/webOrigin on Keycloak's internstore-web client (see
      # keycloak/realm-export.json) and nginx's CORS allowlist (see
      # nginx/nginx.conf's $cors_origin map). Pick a free port and update
      # both places if :5180 also collides on your machine.
      - "5180:5180"
    depends_on:
      - nginx

  nginx:
    build: ./nginx
    ports:
      - "8082:8080"
      - "8443:8443"
    volumes:
      # Persists the self-signed dev cert across `docker compose up --build
      # nginx` — docker-entrypoint-certs.sh only regenerates it if missing.
      # Without this, every nginx rebuild mints a brand new cert and
      # invalidates whatever "accept the risk" exception you'd already
      # granted it in the browser, which then fails silently and looks
      # exactly like a CORS error (see frontend/README's TLS note).
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - auth-backend
      - catalog
      - inventory
      - orders
      - telemetry
      - security
      - chat

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      # Internal Docker network path (kafka:9092) for other containers;
      # localhost:29092 for host-side tools/tests.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Fixed so the single node always rejoins the same KRaft cluster
      # across restarts instead of generating a new random ID each boot.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-topic-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # ai-assistant consumes catalog-events and chat-events (both
        # already listed below); it produces nothing itself, so there's no
        # separate ai-assistant-events topic to create.
        for topic in order-events inventory-events telemetry-events catalog-events chat-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done

volumes:
  keycloak_db_data:
  catalog_db_data:
  inventory_db_data:
  orders_db_data:
  telemetry_db_data:
  security_db_data:
  chat_db_data:
  ai_db_data:
  minio_data:
  kafka_data:
  nginx_certs:
