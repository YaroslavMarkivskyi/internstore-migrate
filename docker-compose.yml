services:
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Pins the `iss` claim on issued tokens to the externally-reachable
      # URL, regardless of which Host header a client used to reach us.
      KC_HOSTNAME: http://localhost:8081
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth-backend:
    build: ./services/auth-backend
    environment:
      PORT: "3000"
      # Must match Keycloak's KC_HOSTNAME-pinned `iss` claim exactly.
      KEYCLOAK_ISSUER: http://localhost:8081/realms/internstore
      # Internal Docker network path — faster, and JWKS content doesn't
      # depend on which hostname you fetch it from.
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/internstore/protocol/openid-connect/certs
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
      INTERNAL_TOKEN_TTL_SECONDS: "60"
      REDIS_URL: redis://redis:6379
    ports:
      # Exposed directly too, for testing /me and /auth/verify without
      # going through nginx (see scripts/test-auth-flows.sh).
      - "3000:3000"
    depends_on:
      - keycloak
      - redis

  echo-service:
    build: ./services/echo-service
    environment:
      PORT: "4000"
      # Must match auth-backend's INTERNAL_TOKEN_SECRET — this is the
      # shared secret every internal service validates the Gateway-minted
      # token against, without calling back to auth-backend or Keycloak.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
    # Not exposed on the host — only reachable through nginx, same as any
    # other real domain service would be.

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog:
    build: ./services/catalog
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://catalog:catalog@catalog-db:5432/catalog
      # Must match auth-backend's INTERNAL_TOKEN_SECRET, same as echo-service.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
    depends_on:
      catalog-db:
        condition: service_healthy
    # Not exposed on the host — only reachable through nginx, same as
    # echo-service.

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory:
    build: ./services/inventory
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://inventory:inventory@inventory-db:5432/inventory
      # Must match auth-backend's INTERNAL_TOKEN_SECRET, same as catalog.
      INTERNAL_TOKEN_SECRET: dev-only-internal-secret-change-me
    depends_on:
      inventory-db:
        condition: service_healthy
    # Not exposed on the host — only reachable through nginx, same as
    # catalog.

  nginx:
    build: ./nginx
    ports:
      - "8082:8080"
      - "8443:8443"
    depends_on:
      - auth-backend
      - echo-service
      - catalog
      - inventory

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      # Internal Docker network path (kafka:9092) for other containers;
      # localhost:29092 for host-side tools/tests.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Fixed so the single node always rejoins the same KRaft cluster
      # across restarts instead of generating a new random ID each boot.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 15

  kafka-topic-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for topic in order-events inventory-events telemetry-events chat-events; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1
        done

volumes:
  keycloak_db_data:
  catalog_db_data:
  inventory_db_data:
  kafka_data:
