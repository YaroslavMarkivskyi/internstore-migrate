# DEV-ONLY: plaintext values committed for local kind/minikube use only.
# See k8s/README.md "Secrets" section — replace with GCP Secret Manager +
# Workload Identity before any real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-gateway-secret
  labels:
    app: mcp-gateway
type: Opaque
stringData:
  INTERNAL_TOKEN_SECRET: "dev-only-internal-secret-change-me"
  AI_DB_URL: "postgresql+asyncpg://ai:ai@postgres-ai:5432/ai"
  # STR-145: same real bug as ai-assistant's secret.yaml — an empty string
  # crash-loops the pod (`AsyncOpenAI(api_key="")` raises `OpenAIError:
  # Missing credentials` at import time). See that file's comment for the
  # full explanation.
  OPENAI_API_KEY: "sk-local-dev-placeholder-not-a-real-key"
