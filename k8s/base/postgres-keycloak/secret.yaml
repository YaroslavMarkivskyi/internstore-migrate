# DEV-ONLY: plaintext values committed for local kind/minikube use only.
# See k8s/README.md "Secrets" section.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-keycloak-secret
  labels:
    app: postgres-keycloak
type: Opaque
stringData:
  POSTGRES_DB: "keycloak"
  POSTGRES_USER: "keycloak"
  POSTGRES_PASSWORD: "keycloak"
