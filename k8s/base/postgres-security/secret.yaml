apiVersion: v1
kind: Secret
metadata:
  name: postgres-security-secret
  labels:
    app: postgres-security
type: Opaque
stringData:
  POSTGRES_DB: "security"
  POSTGRES_USER: "security"
  POSTGRES_PASSWORD: "security"
