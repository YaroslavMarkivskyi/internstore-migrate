apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
  labels:
    app: chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat
  template:
    metadata:
      labels:
        app: chat
    spec:
      enableServiceLinks: false
      containers:
      # No readiness/liveness probes or :8000 here anymore -- chat-gate
      # below owns the network-facing port and health checks. This
      # container isn't reachable at all outside this pod (HOST=127.0.0.1
      # in chat-config) -- only chat-gate/chat-verify/chat-opa share its
      # network namespace.
      - name: chat
        image: internstore/chat:local
        imagePullPolicy: IfNotPresent
        envFrom:
          - configMapRef:
              name: chat-config
          - secretRef:
              name: chat-secret
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      - name: chat-opa
        image: openpolicyagent/opa:latest
        imagePullPolicy: IfNotPresent
        args: ["run", "--server", "--addr=:8181", "/policies/chat.rego", "/policies/common.rego"]
        env:
          - name: INTERNAL_TOKEN_SECRET
            valueFrom:
              secretKeyRef:
                name: chat-secret
                key: INTERNAL_TOKEN_SECRET
        volumeMounts:
        - name: policies
          mountPath: /policies
          readOnly: true
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      - name: chat-verify
        image: internstore/internal-gate:local
        imagePullPolicy: IfNotPresent
        env:
          - name: PORT
            value: "8090"
          - name: OPA_URL
            value: "http://localhost:8181"
          - name: OPA_PACKAGE
            value: "chat"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      - name: chat-gate
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        command: ["nginx", "-c", "/etc/nginx-src/chat.conf", "-g", "daemon off;"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: chat-gate-config
          mountPath: /etc/nginx-src
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: policies
        configMap:
          name: opa-policies
      - name: chat-gate-config
        configMap:
          name: chat-gate-config
