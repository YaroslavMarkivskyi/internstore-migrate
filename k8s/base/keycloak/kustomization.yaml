# config/realm-export.json is a MIRROR of /keycloak/realm-export.json —
# same reason as opa-policies' policies/ mirror (see that directory's
# kustomization.yaml comment): kubectl's built-in kustomize won't read
# configMapGenerator files from outside this directory's own tree, with no
# flag to relax it. Run sync-realm-export.sh after editing the real file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- service.yaml
configMapGenerator:
- name: keycloak-realm-export
  files:
  - realm-export.json=config/realm-export.json
generatorOptions:
  disableNameSuffixHash: true
