apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-telemetry
  labels:
    app: postgres-telemetry
spec:
  serviceName: postgres-telemetry
  replicas: 1
  selector:
    matchLabels:
      app: postgres-telemetry
  template:
    metadata:
      labels:
        app: postgres-telemetry
    spec:
      enableServiceLinks: false
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: postgres-telemetry-secret
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
          # Postgres refuses to initdb into a non-empty mount point that
          # also contains the volume's own lost+found dir — subPath sidesteps
          # that without needing an initContainer, same net effect as
          # compose's named volume (which mounts a dedicated dir, not the PVC
          # root) mapping straight to /var/lib/postgresql/data.
          subPath: postgres
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "telemetry"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "telemetry"]
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-telemetry-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-telemetry-data
  labels:
    app: postgres-telemetry
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
