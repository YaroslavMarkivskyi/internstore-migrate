# Pure Temporal task-queue poller (services/checkout-workflow) — no FastAPI
# app, no HTTP port at all (confirmed: its Dockerfile's CMD is
# `python -m checkout_workflow.worker`, nothing else). Unlike every other
# domain service, there is no GET /health to probe, so — deliberately,
# rather than bolting on a fragile `pgrep`-based exec probe against a
# python:3.12-slim image that doesn't ship procps by default — this
# Deployment carries no readinessProbe/livenessProbe. See k8s/README.md's
# "known gaps" section: crash-looping here shows up only as
# CrashLoopBackOff from the container exiting, not from a failed probe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-workflow-worker
  labels:
    app: checkout-workflow-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-workflow-worker
  template:
    metadata:
      labels:
        app: checkout-workflow-worker
    spec:
      enableServiceLinks: false
      containers:
      - name: checkout-workflow-worker
        image: internstore/checkout-workflow-worker:local
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: checkout-workflow-worker-config
        - secretRef:
            name: checkout-workflow-worker-secret
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
