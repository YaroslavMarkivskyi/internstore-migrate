# DEV-ONLY: plaintext values committed for local kind/minikube use only.
# See k8s/README.md "Secrets" section — replace with GCP Secret Manager +
# Workload Identity before any real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: telemetry-aggregates-secret
  labels:
    app: telemetry-aggregates
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://telemetry-aggregates:telemetry-aggregates@postgres-telemetry-aggregates:5432/telemetry-aggregates"
  INTERNAL_TOKEN_SECRET: "dev-only-internal-secret-change-me"
  # Connects as telemetry_readonly (see telemetry's migration
  # 69ff8539f688), not the full-access `telemetry` user — GRANTed SELECT
  # only on temperature_readings/store_product_thresholds. See
  # services/telemetry-aggregates/README.md's "Backfill job" section.
  TELEMETRY_DB_URL: "postgresql+asyncpg://telemetry_readonly:telemetry-readonly@postgres-telemetry:5432/telemetry"
