apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
  labels:
    app: orders
data:
  # Not the network-facing port anymore -- the orders-gate container
  # below occupies :8000 (what the Service still targets, unchanged) and
  # proxies here. HOST=127.0.0.1 means this is unreachable from outside
  # the pod even if something guesses the port.
  PORT: "8010"
  HOST: "127.0.0.1"
  INVENTORY_BASE_URL: "http://inventory:8000"
  INVENTORY_TIMEOUT_SECONDS: "5.0"
  CATALOG_BASE_URL: "http://catalog:8000"
  CATALOG_TIMEOUT_SECONDS: "5.0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  OUTBOX_POLL_INTERVAL_SECONDS: "1.0"
  TEMPORAL_HOST: "temporal:7233"
  TEMPORAL_TASK_QUEUE: "checkout-workflow"
  CHECKOUT_V2_WAIT_SECONDS: "10.0"
