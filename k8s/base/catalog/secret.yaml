# DEV-ONLY: plaintext values committed for local kind/minikube use only.
# See k8s/README.md "Secrets" section — replace with GCP Secret Manager +
# Workload Identity before any real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secret
  labels:
    app: catalog
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://catalog:catalog@postgres-catalog:5432/catalog"
  INTERNAL_TOKEN_SECRET: "dev-only-internal-secret-change-me"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
