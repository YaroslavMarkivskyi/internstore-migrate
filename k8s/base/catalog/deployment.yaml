apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      enableServiceLinks: false
      initContainers:
      # Schema migrations as a release-phase step, not part of the app's own
      # start-up (12-factor XII). Same image; the entrypoint execs any args
      # verbatim instead of the server. Runs on every rollout; Alembic is a
      # no-op when already at head.
      - name: migrate
        image: internstore/catalog:local
        imagePullPolicy: IfNotPresent
        args: ["alembic", "upgrade", "head"]
        envFrom:
        - configMapRef:
            name: catalog-config
        - secretRef:
            name: catalog-secret
            optional: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      containers:
      - name: catalog
        image: internstore/catalog:local
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: catalog-config
        - secretRef:
            name: catalog-secret
            optional: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - name: catalog-opa
        image: openpolicyagent/opa:latest
        imagePullPolicy: IfNotPresent
        args:
        - run
        - --server
        - --addr=:8181
        - /policies/catalog.rego
        - /policies/common.rego
        env:
        - name: INTERNAL_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: catalog-secret
              key: INTERNAL_TOKEN_SECRET
              optional: true
        volumeMounts:
        - name: policies
          mountPath: /policies
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      - name: catalog-verify
        image: internstore/internal-gate:local
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: '8090'
        - name: OPA_URL
          value: http://localhost:8181
        - name: OPA_PACKAGE
          value: catalog
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      - name: catalog-gate
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        command:
        - nginx
        - -c
        - /etc/nginx-src/catalog.conf
        - -g
        - daemon off;
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: catalog-gate-config
          mountPath: /etc/nginx-src
          readOnly: true
        # Both probes traverse this gate to the app (nginx passes GETs straight
        # through). Readiness checks the DB via /ready so a DB outage depools
        # the pod; liveness stays on /health so it does not also restart it.
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: policies
        configMap:
          name: opa-policies
      - name: catalog-gate-config
        configMap:
          name: catalog-gate-config
