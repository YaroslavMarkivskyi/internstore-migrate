apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  labels:
    app: catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      enableServiceLinks: false
      containers:
      - name: catalog
        image: internstore/catalog:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
          - configMapRef:
              name: catalog-config
          - secretRef:
              name: catalog-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      - name: catalog-opa
        image: openpolicyagent/opa:latest
        imagePullPolicy: IfNotPresent
        args: ["run", "--server", "--addr=:8181", "/policies/catalog.rego", "/policies/common.rego"]
        env:
          # common.rego's `subject` rule verifies X-Internal-Token itself
          # now (io.jwt.decode_verify) instead of catalog trusting a
          # pre-decoded input.subject -- same secret as the catalog
          # container's own INTERNAL_TOKEN_SECRET, referenced by key
          # rather than the whole envFrom (this sidecar has no business
          # seeing catalog-secret's DATABASE_URL/MinIO keys too).
          - name: INTERNAL_TOKEN_SECRET
            valueFrom:
              secretKeyRef:
                name: catalog-secret
                key: INTERNAL_TOKEN_SECRET
        volumeMounts:
        - name: policies
          mountPath: /policies
          readOnly: true
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: policies
        configMap:
          name: opa-policies
