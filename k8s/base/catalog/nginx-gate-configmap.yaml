# Same content as nginx/internal-gate/catalog.conf (compose's source of
# truth for this) -- kept in sync by hand, same treatment as
# k8s/base/opa-policies' sync-policies.sh gives policies/*.rego (small
# enough here not to need its own script).
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-gate-config
  labels:
    app: catalog
data:
  catalog.conf: |
    worker_processes 1;
    events {
      worker_connections 128;
    }

    http {
      map $request_method $catalog_needs_auth {
        default 1;
        GET     0;
      }

      server {
        listen 8000;
        client_max_body_size 25m; # product image uploads (20MB limit + margin)

        location = /internal/verify {
          internal;
          proxy_pass http://127.0.0.1:8090/verify;
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header X-Internal-Token $http_x_internal_token;
          proxy_set_header X-Original-Method $request_method;
        }

        location / {
          # error_page trick to conditionally require auth_request only for
          # non-GET methods -- auth_request itself can't be made conditional
          # directly (no `if` support for it), so GET falls straight through
          # here and everything else redirects to the @gated named location.
          error_page 418 = @gated;
          if ($catalog_needs_auth) {
            return 418;
          }
          proxy_pass http://127.0.0.1:8010;
        }

        location @gated {
          auth_request /internal/verify;
          auth_request_set $user_id $upstream_http_x_user_id;
          auth_request_set $user_role $upstream_http_x_user_role;
          proxy_set_header X-User-Id $user_id;
          proxy_set_header X-User-Role $user_role;
          proxy_pass http://127.0.0.1:8010;
        }
      }
    }
