apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-config
  labels:
    app: catalog
data:
  # Not the network-facing port anymore -- the catalog-gate container
  # below occupies :8000 (what the Service still targets, unchanged) and
  # proxies here. HOST=127.0.0.1 means this is unreachable from outside
  # the pod even if something guesses the port -- catalog-gate/
  # catalog-verify/catalog-opa are the only containers sharing it.
  PORT: "8010"
  HOST: "127.0.0.1"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_PUBLIC_BASE_URL: "http://localhost:9000"
  MINIO_BUCKET: "catalog-product-images"
  INVENTORY_BASE_URL: "http://inventory:8000"
  INVENTORY_TIMEOUT_SECONDS: "5.0"
