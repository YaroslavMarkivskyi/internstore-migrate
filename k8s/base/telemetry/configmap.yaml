apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-config
  labels:
    app: telemetry
data:
  # Not the network-facing port anymore -- the telemetry-gate container
  # below occupies :8000 (what the Service still targets, unchanged) and
  # proxies here. HOST=127.0.0.1 means this is unreachable from outside
  # the pod even if something guesses the port.
  PORT: "8010"
  HOST: "127.0.0.1"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  VIOLATION_CHECK_INTERVAL_SECONDS: "5"
  VIOLATION_WINDOW_SECONDS: "20"
