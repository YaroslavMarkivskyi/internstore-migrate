# Single-node KRaft-mode broker+controller (apache/kafka:3.7.0) — confirmed
# from docker-compose.yml's KAFKA_PROCESS_ROLES: broker,controller /
# KAFKA_CONTROLLER_QUORUM_VOTERS: no separate Zookeeper service exists to
# port. Compose's PLAINTEXT_HOST://:29092 host-debug listener (for
# host-side tools) is deliberately dropped here — no host port is needed
# in-cluster, every consumer/producer is itself a pod using the
# ClusterIP Service's DNS name (see k8s/README.md).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      enableServiceLinks: false
      containers:
      - name: kafka
        image: apache/kafka:3.7.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9092
        - containerPort: 9093
        env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://:9092,CONTROLLER://:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka:9092"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        # STR-145: was "1@kafka:9093" (the Service DNS name) — on a real
        # kind cluster this made the single broker/controller register
        # with itself over the ClusterIP Service's hairpin path instead of
        # a same-pod loopback, and consistently failed its own internal
        # registration handshake ~60-70s after every start ("unable to
        # register with the controller quorum" / CancellationException),
        # regardless of CPU headroom — a fixed protocol-level timeout, not
        # contention. There's only one node in this quorum and it's always
        # the pod talking to itself, so localhost is both correct and
        # avoids the Service round-trip entirely.
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@localhost:9093"
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: "PLAINTEXT"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "1"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "1"
        - name: CLUSTER_ID
          value: "4L6g3nShT-eMCtK--X86sw"
        volumeMounts:
        - name: data
          mountPath: /var/lib/kafka/data
          subPath: kafka
        # STR-145: was `kafka-topics.sh --bootstrap-server localhost:9092
        # --list`. That command bootstraps via localhost fine, but the
        # admin client then reconnects using the *advertised* listener
        # ("kafka:9092", the Service DNS name, per KAFKA_ADVERTISED_LISTENERS
        # above) for the actual list-topics RPC — which means the probe,
        # running inside this same pod, ends up routing back through this
        # pod's own Service ClusterIP. That self-Service hairpin path is
        # unreliable on this kind cluster (same class of issue as the
        # KAFKA_CONTROLLER_QUORUM_VOTERS fix above), so the probe timed
        # out ("Timed out waiting to send the call: listTopics") even once
        # the broker was fully up and accepting real connections. A plain
        # TCP check against the actual listener port sidesteps the
        # advertised-listener redirect entirely and is a perfectly
        # sufficient liveness/readiness signal for a single-broker dev
        # cluster (real client pods, being genuinely remote from kafka-0,
        # don't hit this hairpin path — only same-pod tooling does).
        readinessProbe:
          exec:
            command: ["bash", "-c", "exec 3<>/dev/tcp/localhost/9092"]
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          exec:
            command: ["bash", "-c", "exec 3<>/dev/tcp/localhost/9092"]
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kafka-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  labels:
    app: kafka
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
