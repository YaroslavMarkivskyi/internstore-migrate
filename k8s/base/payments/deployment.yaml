apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels:
    app: payments
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      enableServiceLinks: false
      containers:
      - name: payments
        image: internstore/payments:local
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: payments-config
        - secretRef:
            name: payments-secret
            optional: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - name: payments-opa
        image: openpolicyagent/opa:latest
        imagePullPolicy: IfNotPresent
        args:
        - run
        - --server
        - --addr=:8181
        - /policies/payments.rego
        - /policies/common.rego
        env:
        - name: INTERNAL_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: payments-secret
              key: INTERNAL_TOKEN_SECRET
              optional: true
        volumeMounts:
        - name: policies
          mountPath: /policies
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      - name: payments-verify
        image: internstore/internal-gate:local
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: '8090'
        - name: OPA_URL
          value: http://localhost:8181
        - name: OPA_PACKAGE
          value: payments
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      - name: payments-gate
        image: nginx:1.27-alpine
        imagePullPolicy: IfNotPresent
        command:
        - nginx
        - -c
        - /etc/nginx-src/payments.conf
        - -g
        - daemon off;
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: payments-gate-config
          mountPath: /etc/nginx-src
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: policies
        configMap:
          name: opa-policies
      - name: payments-gate-config
        configMap:
          name: payments-gate-config
