apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  labels:
    app: payments
data:
  # Not the network-facing port anymore -- the payments-gate container
  # below occupies :8000 (what the Service still targets, unchanged) and
  # proxies here. HOST=127.0.0.1 means this is unreachable from outside
  # the pod even if something guesses the port.
  PORT: "8010"
  HOST: "127.0.0.1"
  PAYMENT_FAIL_ON_AMOUNT_SUFFIX: "99"
