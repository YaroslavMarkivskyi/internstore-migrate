# DEV-ONLY: plaintext values committed for local kind/minikube use only.
# See k8s/README.md "Secrets" section — replace with GCP Secret Manager +
# Workload Identity before any real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: ai-assistant-secret
  labels:
    app: ai-assistant
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://ai:ai@postgres-ai:5432/ai"
  INTERNAL_TOKEN_SECRET: "dev-only-internal-secret-change-me"
  # STR-145: an empty string here crash-loops the pod — the OpenAI SDK's
  # own client constructor (`AsyncOpenAI(api_key=...)` in main.py) raises
  # `OpenAIError: Missing credentials` at import time for a falsy key,
  # unlike Stripe's client (which only 401s lazily, at call time — see
  # docker-compose.yml's comment this was modeled after). Compose's
  # `${OPENAI_API_KEY:-}` default only "still boots" in practice because
  # local devs set a real value in their own .env; caught here because
  # this is the first time the manifest was run against a real cluster
  # with no .env to fall back on. A non-empty placeholder satisfies the
  # constructor; real AI-assistant calls still fail (401) without a real
  # key, same as Stripe's documented behavior.
  OPENAI_API_KEY: "sk-local-dev-placeholder-not-a-real-key"
