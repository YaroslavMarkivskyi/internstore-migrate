# DEV-ONLY: plaintext values committed for local kind/minikube use only.
# See k8s/README.md "Secrets" section — replace with GCP Secret Manager +
# Workload Identity before any real deployment.
apiVersion: v1
kind: Secret
metadata:
  name: ai-assistant-secret
  labels:
    app: ai-assistant
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://ai:ai@postgres-ai:5432/ai"
  INTERNAL_TOKEN_SECRET: "dev-only-internal-secret-change-me"
  # STR-161b: OPENAI_API_KEY removed, no replacement secret needed — Gemini
  # via the Gemini Enterprise Agent Platform authenticates with IAM/
  # Workload Identity (see main.py's genai.Client(enterprise=True, ...)),
  # and unlike AsyncOpenAI's constructor, genai.Client() never raises at
  # construction on a missing/empty project, so STR-145's crash-loop
  # placeholder trick isn't needed here either — see README's "Dev gaps"
  # for what local kind/minikube dev needs instead (no Workload Identity
  # outside GKE).
