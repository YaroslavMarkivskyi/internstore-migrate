apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-assistant-config
  labels:
    app: ai-assistant
data:
  PORT: "8000"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_URL: "redis://redis:6379"
  CHAT_SERVICE_URL: "http://chat:8000"
  ORDERS_SERVICE_URL: "http://orders:8000"
  AI_MODE_DEFAULT: "ai"
  AI_RATE_LIMIT: "10"
  MCP_GATEWAY_URL: "http://mcp-gateway:8000"
  # STR-146: refreshes the customer's forwarded internal-token mid-ReAct-loop
  # via auth-backend's POST /auth/refresh when it's close to its 60s TTL.
  AUTH_BACKEND_URL: "http://auth-backend:3000"
  # STR-161b: not a secret — identifies which GCP project's Gemini
  # Enterprise Agent Platform to call; the actual credential is IAM/
  # Workload Identity, not a token that lives in this configmap. Must match
  # the real GCP project id in any real deployment (placeholder here is
  # only valid for local kind/minikube, where Gemini calls will fail
  # without real Application Default Credentials anyway — see README).
  GCP_PROJECT: "internstore-dev"
