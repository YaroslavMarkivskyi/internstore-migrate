apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels:
    app: grafana
data:
  # Phase 1 has no instrumented services yet (that's Phase 2), so this
  # dashboard proves the pipeline itself is alive using each component's
  # own self-reported metrics — not app data. Swap/extend once services
  # start exporting OTLP.
  lgtm-pipeline-health.json: |
    {
      "title": "LGTM Pipeline Health",
      "uid": "lgtm-pipeline-health",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Alloy - up",
          "type": "stat",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "targets": [
            { "expr": "up{job=\"alloy\"}", "refId": "A" }
          ]
        },
        {
          "id": 2,
          "title": "Loki - bytes received / s",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 9, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "targets": [
            { "expr": "sum(rate(loki_distributor_bytes_received_total[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 3,
          "title": "Tempo - spans received / s",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 9, "x": 15, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "targets": [
            { "expr": "sum(rate(tempo_distributor_spans_received_total[5m]))", "refId": "A" }
          ]
        },
        {
          "id": 4,
          "title": "Mimir - active series",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "mimir" },
          "targets": [
            { "expr": "sum(cortex_ingester_active_series)", "refId": "A" }
          ]
        },
        {
          "id": 5,
          "title": "Service graph (from Tempo span-metrics)",
          "type": "nodeGraph",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "tempo", "uid": "tempo" },
          "targets": [
            { "queryType": "serviceMap", "refId": "A" }
          ]
        }
      ]
    }
