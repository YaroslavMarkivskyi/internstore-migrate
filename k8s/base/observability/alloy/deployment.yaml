apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    app: alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      enableServiceLinks: false
      containers:
      - name: alloy
        image: grafana/alloy:v1.4.3
        imagePullPolicy: IfNotPresent
        args:
        - "run"
        - "--server.http.listen-addr=0.0.0.0:12345"
        - "/etc/alloy/config.alloy"
        ports:
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        - containerPort: 12345
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 12345
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /-/ready
            port: 12345
          initialDelaySeconds: 15
          periodSeconds: 10
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "192Mi"
      volumes:
      - name: config
        configMap:
          name: alloy-config
