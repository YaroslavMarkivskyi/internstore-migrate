apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  labels:
    app: alloy
data:
  config.alloy: |
    // OTLP receiver — every service's OpenTelemetry SDK exports here.
    // gRPC on 4317, HTTP on 4318 (the ports the ticket asks for), fanning
    // out traces to Tempo, logs to Loki, and metrics to Mimir.
    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }

      output {
        traces  = [otelcol.exporter.otlp.tempo.input]
        metrics = [otelcol.processor.batch.default.input]
        logs    = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      output {
        metrics = [otelcol.exporter.prometheus.default.input]
        logs    = [otelcol.exporter.loki.default.input]
      }
    }

    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo:4317"
        tls {
          insecure = true
        }
      }
    }

    otelcol.exporter.loki "default" {
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }

    otelcol.exporter.prometheus "default" {
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir:9009/api/v1/push"
        // Mimir routes by X-Scope-OrgID even with multitenancy_enabled:
        // false (requests with no header land in a separate "anonymous"
        // tenant instead of being merged) — pin the same tenant Tempo's
        // metrics-generator writes under so app metrics and span-metrics
        // land in one place Grafana can query.
        headers = {
          "X-Scope-OrgID" = "single-tenant",
        }
      }
    }
