# Optional: `kind create cluster --config k8s/kind-config.yaml --name internstore`
# maps the NodePorts this manifest set uses straight onto the host, so
# nginx/keycloak/minio/temporal-ui are reachable at localhost without a
# separate `kubectl port-forward`. Without this file, `kind create cluster`
# still works fine — just use port-forward instead (see k8s/README.md).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30843   # nginx https
    hostPort: 8443
  - containerPort: 30082   # nginx http
    hostPort: 8082
  - containerPort: 30081   # keycloak
    hostPort: 8081
  - containerPort: 30900   # minio api
    hostPort: 9000
  - containerPort: 30901   # minio console
    hostPort: 9001
  - containerPort: 30088   # temporal-ui
    hostPort: 8088
