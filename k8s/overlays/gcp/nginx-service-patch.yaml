# Strategic-merge patch, applied to base's existing nginx Service (kept as
# NodePort — harmless on GKE, and simpler than also patching `spec.type`)
# — adds the two annotations GKE's Ingress controller needs to route to it
# via container-native load balancing and attach the BackendConfig/Cloud
# Armor from backendconfig.yaml.
apiVersion: v1
kind: Service
metadata:
  name: nginx
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "nginx-backendconfig"}'
