# Assumes the base Deployment's main container is named "chat"
# (true for every service this generator covers — checked against
# k8s/base/chat/deployment.yaml) — the CSI volumeMount patches onto it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat
spec:
  template:
    spec:
      serviceAccountName: chat
      containers:
      - name: chat
        volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets-store
          readOnly: true
      - name: cloudsql-proxy
        image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
        args:
          - "example-project-123:us-central1:internstore-demo-chat?port=5432"
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: chat-secrets
