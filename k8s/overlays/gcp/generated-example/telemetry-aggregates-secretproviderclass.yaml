apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: telemetry-aggregates-secrets
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/example-project-123/secrets/internstore-demo-internal-token-secret/versions/latest"
        fileName: "INTERNAL_TOKEN_SECRET"
      - resourceName: "projects/example-project-123/secrets/internstore-demo-telemetry-aggregates-database-url/versions/latest"
        fileName: "DATABASE_URL"
      - resourceName: "projects/example-project-123/secrets/internstore-demo-telemetry-aggregates-telemetry-db-url/versions/latest"
        fileName: "TELEMETRY_DB_URL"
  secretObjects:
  - secretName: telemetry-aggregates-secret
    type: Opaque
    data:
    - objectName: "INTERNAL_TOKEN_SECRET"
      key: "INTERNAL_TOKEN_SECRET"
    - objectName: "DATABASE_URL"
      key: "DATABASE_URL"
    - objectName: "TELEMETRY_DB_URL"
      key: "TELEMETRY_DB_URL"
