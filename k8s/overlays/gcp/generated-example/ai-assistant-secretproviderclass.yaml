apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ai-assistant-secrets
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/example-project-123/secrets/internstore-demo-internal-token-secret/versions/latest"
        fileName: "INTERNAL_TOKEN_SECRET"
      - resourceName: "projects/example-project-123/secrets/internstore-demo-ai-assistant-database-url/versions/latest"
        fileName: "DATABASE_URL"
      - resourceName: "projects/example-project-123/secrets/internstore-demo-openai-api-key/versions/latest"
        fileName: "OPENAI_API_KEY"
  secretObjects:
  - secretName: ai-assistant-secret
    type: Opaque
    data:
    - objectName: "INTERNAL_TOKEN_SECRET"
      key: "INTERNAL_TOKEN_SECRET"
    - objectName: "DATABASE_URL"
      key: "DATABASE_URL"
    - objectName: "OPENAI_API_KEY"
      key: "OPENAI_API_KEY"
