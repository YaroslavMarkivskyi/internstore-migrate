apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: catalog-secrets
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/example-project-123/secrets/internstore-demo-internal-token-secret/versions/latest"
        fileName: "INTERNAL_TOKEN_SECRET"
      - resourceName: "projects/example-project-123/secrets/internstore-demo-catalog-database-url/versions/latest"
        fileName: "DATABASE_URL"
      - resourceName: "projects/example-project-123/secrets/internstore-demo-gcs-hmac-access-id/versions/latest"
        fileName: "OBJECT_STORAGE_ACCESS_KEY"
      - resourceName: "projects/example-project-123/secrets/internstore-demo-gcs-hmac-secret/versions/latest"
        fileName: "OBJECT_STORAGE_SECRET_KEY"
  secretObjects:
  - secretName: catalog-secret
    type: Opaque
    data:
    - objectName: "INTERNAL_TOKEN_SECRET"
      key: "INTERNAL_TOKEN_SECRET"
    - objectName: "DATABASE_URL"
      key: "DATABASE_URL"
    - objectName: "OBJECT_STORAGE_ACCESS_KEY"
      key: "OBJECT_STORAGE_ACCESS_KEY"
    - objectName: "OBJECT_STORAGE_SECRET_KEY"
      key: "OBJECT_STORAGE_SECRET_KEY"
