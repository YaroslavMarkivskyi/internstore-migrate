# kind/minikube overlay — this ticket's target environment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: default

resources:
- ../../base

# Local-only tweak: bump every workload's memory limit up a bit (see
# patches/bump-memory-limit.yaml) — a stand-in for whatever this cluster's
# actual local resource headroom calls for. imagePullPolicy is NOT
# overridden here; base's IfNotPresent already does the right thing for
# `kind load docker-image`-d images (see that patch file's comment).
patches:
- path: patches/bump-memory-limit.yaml
  target:
    kind: Deployment
- path: patches/bump-memory-limit.yaml
  target:
    kind: StatefulSet
- path: patches/reduce-cpu-request.yaml
  target:
    kind: Deployment
- path: patches/reduce-cpu-request.yaml
  target:
    kind: StatefulSet
- path: patches/loosen-probe-tolerance.yaml
  target:
    kind: Deployment
    # excludes checkout-workflow-worker: it carries no readinessProbe/
    # livenessProbe at all (see its deployment.yaml comment), so this
    # patch's `add` ops have no parent path to attach to there. Also
    # excludes catalog, security, payments, inventory, orders, chat and
    # telemetry: their readiness/liveness probes moved off containers/0
    # onto their own *-gate container (index 3) when internal-token
    # verification moved into that sidecar chain -- see
    # patches/catalog-gate-probe-tolerance.yaml,
    # patches/security-gate-probe-tolerance.yaml,
    # patches/payments-gate-probe-tolerance.yaml,
    # patches/inventory-gate-probe-tolerance.yaml,
    # patches/orders-gate-probe-tolerance.yaml,
    # patches/chat-gate-probe-tolerance.yaml and
    # patches/telemetry-gate-probe-tolerance.yaml below for their
    # equivalents.
    name: "^(ai-assistant|auth-backend|mcp-gateway|mock-camera|nginx|notifications|redis|temporal|temporal-ui)$"
- path: patches/catalog-gate-probe-tolerance.yaml
  target:
    kind: Deployment
    name: "^catalog$"
- path: patches/security-gate-probe-tolerance.yaml
  target:
    kind: Deployment
    name: "^security$"
- path: patches/payments-gate-probe-tolerance.yaml
  target:
    kind: Deployment
    name: "^payments$"
- path: patches/inventory-gate-probe-tolerance.yaml
  target:
    kind: Deployment
    name: "^inventory$"
- path: patches/orders-gate-probe-tolerance.yaml
  target:
    kind: Deployment
    name: "^orders$"
- path: patches/chat-gate-probe-tolerance.yaml
  target:
    kind: Deployment
    name: "^chat$"
- path: patches/telemetry-gate-probe-tolerance.yaml
  target:
    kind: Deployment
    name: "^telemetry$"
- path: patches/loosen-probe-tolerance.yaml
  target:
    kind: StatefulSet
- path: patches/kafka-cpu-request.yaml
  target:
    kind: StatefulSet
    name: "^kafka$"
