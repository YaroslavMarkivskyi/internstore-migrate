# Demonstrates the overlay-patch mechanism with something that's actually
# safe to apply blanket across every Deployment/StatefulSet regardless of
# how many containers a given pod has (containers[0] is always that pod's
# main container, whether or not it also carries an OPA sidecar at
# index 1) — a JSON6902 patch targeting a specific container *name* can't
# be applied blanket like this without accidentally injecting a phantom
# container into pods that don't have one by that name, so index 0 is the
# only universally-safe target.
#
# imagePullPolicy is deliberately NOT overridden here: base already sets
# IfNotPresent, which is correct for both `kind load docker-image`-d local
# images (found already-present, so never pulled) and a future GCP overlay
# pulling from a real registry — no local-vs-GCP divergence to patch. See
# k8s/README.md.
#
# Value bumped 768Mi -> 1536Mi after a real OOMKill on a live kind cluster
# (STR-145): base sets keycloak/kafka/temporal's own memory *limit* to
# 1Gi, so a blanket `replace` to 768Mi was silently a *cut* for those
# three, not a bump, and keycloak got OOMKilled as a direct result. 1536Mi
# is comfortably above every base limit (highest is 1Gi) so this patch is
# now a bump for every container, never a cut, regardless of what base
# sets per-service.
- op: replace
  path: /spec/template/spec/containers/0/resources/limits/memory
  value: "1536Mi"
