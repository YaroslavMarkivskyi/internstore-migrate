# Internal gate for inventory: sits in front of the FastAPI app (same pod
# / network namespace as inventory and inventory-opa, see docker-compose.yml's
# `network_mode: "service:inventory"` and k8s/base/inventory/deployment.yaml),
# occupying the port every other service's InventoryClient already calls
# this one at (inventory:8000) so nothing outside this pod needs to change.
#
# Unlike catalog (method-based) or security (path-based public/private),
# inventory has THREE tiers, not two:
#   - public:  read-only aggregate/listing/detail GETs -- no token at all
#   - any:     check-availability/reserve/release -- any authenticated
#              caller is enough (mirrors get_internal_claims with no
#              require_admin on top -- see routers/stocks.py's git history;
#              check-availability in particular gets a *forwarded customer
#              token* from Orders, not an admin one)
#   - admin:   every stock/stock_item mutation, plus the history/as-of
#              read endpoints (mirrors require_admin/require_authz's
#              previous behavior there)
#
# $inventory_auth_mode carries all three; the "any" vs "admin" distinction
# for gated routes is forwarded to inventory-verify as X-Required-Role,
# which passes it straight through into OPA's input (see
# services/internal-gate and policies/inventory.rego's `required_role`).
#
# Same reasoning as nginx/internal-gate/catalog.conf for why the auth
# check needs a real proxied upstream (inventory-verify), not nginx config
# alone.
worker_processes 1;
events {
  worker_connections 128;
}

http {
  map "$request_method:$uri" $inventory_auth_mode {
    default                           admin;

    "GET:/health"                     public;
    "GET:/items"                      public;
    "GET:/items/detailed"             public;
    "GET:/stocks"                     public;
    "~^GET:/stocks/[^/]+$"            public;
    "~^GET:/stocks/[^/]+/items$"      public;

    "POST:/stocks/check-availability" any;
    "POST:/stocks/reserve"            any;
    "POST:/stocks/release"            any;
  }

  server {
    listen 8000;

    location = /internal/verify {
      internal;
      proxy_pass http://127.0.0.1:8090/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Internal-Token $http_x_internal_token;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Required-Role $inventory_auth_mode;
    }

    location / {
      error_page 418 = @gated;
      if ($inventory_auth_mode != public) {
        return 418;
      }
      proxy_pass http://127.0.0.1:8010;
    }

    location @gated {
      auth_request /internal/verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_pass http://127.0.0.1:8010;
    }
  }
}
