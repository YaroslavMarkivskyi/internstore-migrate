# Internal gate for telemetry: sits in front of the FastAPI app (same pod
# / network namespace as telemetry and telemetry-opa, see
# docker-compose.yml's `network_mode: "service:telemetry"` and
# k8s/base/telemetry/deployment.yaml), occupying the port every other
# caller already reaches this one at (telemetry:8000) so nothing outside
# this pod needs to change.
#
# Simplest split in this repo: every gated route is admin-only (store
# threshold updates, readings, incidents) -- GET /stores (the storefront's
# public store list) and POST /measurements (the telemetry-simulator
# container, no logged-in session at all -- see routers/measurements.py's
# comment) are the only exemptions, alongside /health.
#
# Same reasoning as nginx/internal-gate/catalog.conf for why the auth
# check needs a real proxied upstream (telemetry-verify), not nginx config
# alone.
worker_processes 1;
events {
  worker_connections 128;
}

http {
  map $uri $telemetry_needs_auth {
    default        1;
    "/health"       0;
    "/measurements" 0;
    "/stores"       0;
  }

  server {
    listen 8000;

    location = /internal/verify {
      internal;
      proxy_pass http://127.0.0.1:8090/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Internal-Token $http_x_internal_token;
      proxy_set_header X-Original-Method $request_method;
    }

    location / {
      error_page 418 = @gated;
      if ($telemetry_needs_auth) {
        return 418;
      }
      proxy_pass http://127.0.0.1:8010;
    }

    location @gated {
      auth_request /internal/verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_pass http://127.0.0.1:8010;
    }
  }
}
