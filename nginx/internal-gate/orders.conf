# Internal gate for orders: sits in front of the FastAPI app (same pod /
# network namespace as orders and orders-opa, see docker-compose.yml's
# `network_mode: "service:orders"` and k8s/base/orders/deployment.yaml),
# occupying the port the external Gateway already calls this one at
# (orders:8000) so nothing outside this pod needs to change.
#
# Orders differs from catalog/security/payments/inventory in one important
# way: it can't move ALL authorization here. GET /orders/{id}'s "is this
# my order" check needs order.owner_id from Orders' own DB, which this
# gate has no access to -- that check stays in the app (routers/orders.py
# calls the same orders-opa sidecar directly, see policies/orders.rego's
# resource-level rules). What DOES move here is the coarse, route-level
# tier: is the caller authenticated at all, and for admin-only/
# admin-or-assistant routes, do they hold the right role. The app no
# longer verifies the token itself either way -- it trusts X-User-Id/
# X-User-Role, forwarded below once this gate has verified them.
#
# Same reasoning as nginx/internal-gate/catalog.conf for why the auth
# check needs a real proxied upstream (orders-verify), not nginx config
# alone.
worker_processes 1;
events {
  worker_connections 128;
}

http {
  map "$request_method:$uri" $orders_auth_tier {
    default                                                     any;

    "GET:/health"                                                public;
    # Stripe has no internal token to send -- its own signature (verified
    # in routers/payments.py) is the only auth this route gets.
    "POST:/webhooks/stripe"                                      public;

    "GET:/admin"                                                 admin_or_assistant;
    "~^GET:/admin/[^/]+$"                                        admin;
    "~^POST:/admin/[^/]+/pay$"                                    admin;
    "~^POST:/admin/[^/]+/ship$"                                   admin;

    "POST:/internal/checkout-workflow/orders"                    admin;
    "~^PATCH:/internal/checkout-workflow/orders/[^/]+/status$"   admin;
  }

  server {
    listen 8000;

    location = /internal/verify {
      internal;
      proxy_pass http://127.0.0.1:8090/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Internal-Token $http_x_internal_token;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Required-Role $orders_auth_tier;
    }

    location / {
      error_page 418 = @gated;
      if ($orders_auth_tier != public) {
        return 418;
      }
      proxy_pass http://127.0.0.1:8010;
    }

    location @gated {
      auth_request /internal/verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_pass http://127.0.0.1:8010;
    }
  }
}
