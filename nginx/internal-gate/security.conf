# Internal gate for security: sits in front of the FastAPI app (same pod /
# network namespace as security and security-opa, see docker-compose.yml's
# `network_mode: "service:security"` and k8s/base/security/deployment.yaml),
# occupying the port every other service already calls this one at
# (security:8000) so nothing outside this pod needs to change.
#
# Unlike catalog (public GET, admin-gated writes), security's split is
# path-based, not method-based: /auth/* (fingerprint/nfc, called directly
# by the hardware simulator, never through an internal token -- see
# routers/hardware.py's own comment) is always public, and everything
# else (/users, /visit-log, /warehouses -- including their own GET routes)
# is admin-only regardless of method. See policies/security.rego.
#
# Same reasoning as nginx/internal-gate/catalog.conf for why the auth
# check needs a real proxied upstream (security-verify), not nginx config
# alone.
worker_processes 1;
events {
  worker_connections 128;
}

http {
  map $uri $security_needs_auth {
    default    1;
    "~^/auth/" 0;
    "/health"  0;
  }

  server {
    listen 8000;

    location = /internal/verify {
      internal;
      proxy_pass http://127.0.0.1:8090/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Internal-Token $http_x_internal_token;
      proxy_set_header X-Original-Method $request_method;
    }

    location / {
      error_page 418 = @gated;
      if ($security_needs_auth) {
        return 418;
      }
      proxy_pass http://127.0.0.1:8010;
    }

    location @gated {
      auth_request /internal/verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_pass http://127.0.0.1:8010;
    }
  }
}
