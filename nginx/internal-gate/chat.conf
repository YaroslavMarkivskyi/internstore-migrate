# Internal gate for chat: sits in front of the FastAPI app (same pod /
# network namespace as chat and chat-opa, see docker-compose.yml's
# `network_mode: "service:chat"` and k8s/base/chat/deployment.yaml),
# occupying the port the external Gateway already calls this one at
# (chat:8000) so nothing outside this pod needs to change.
#
# Room-ownership decisions ("is this my room") stay inline in chat's own
# code (routers/mode.py's _room_owner_matches, routers/attachments.py's
# _authorize_room_access, ws/room.py's own copy) -- they're either pure
# functions of room_id + the caller's own sub, or (attachments) need a DB
# lookup this gate has no access to, same reasoning as
# nginx/internal-gate/orders.conf. What moves here is the coarse,
# route-level tier: is the caller authenticated at all, and for
# admin-only/admin-or-assistant/assistant-only routes, do they hold the
# right role. The app no longer verifies the token itself -- it trusts
# X-User-Id/X-User-Role, forwarded below.
#
# The WebSocket handshake (/ws/room/{id}) goes through this same
# auth_request gate -- it's a plain HTTP GET with an Upgrade header, so
# auth_request works on it exactly like any REST call; the Upgrade/
# Connection headers only matter on the *final* proxy_pass to the app, not
# on the auth_request subrequest itself.
#
# Same reasoning as nginx/internal-gate/catalog.conf for why the auth
# check needs a real proxied upstream (chat-verify), not nginx config
# alone.
worker_processes 1;
events {
  worker_connections 128;
}

http {
  map "$request_method:$uri" $chat_auth_tier {
    default                              any;

    "GET:/health"                        public;

    "GET:/rooms"                         admin;
    "~^GET:/rooms/[^/]+/messages$"       admin_or_assistant;
    "~^DELETE:/rooms/[^/]+$"             admin;
    "~^POST:/rooms/[^/]+/messages$"      assistant;
    "~^POST:/rooms/[^/]+/messages/stream$" assistant;
  }

  server {
    listen 8000;

    location = /internal/verify {
      internal;
      proxy_pass http://127.0.0.1:8090/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Internal-Token $http_x_internal_token;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Required-Role $chat_auth_tier;
    }

    location / {
      error_page 418 = @gated;
      if ($chat_auth_tier != public) {
        return 418;
      }
      proxy_pass http://127.0.0.1:8010;
    }

    location @gated {
      auth_request /internal/verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;

      # WebSocket upgrade support -- harmless no-op for plain REST calls
      # through this same location (they don't send an Upgrade header, so
      # nginx just proxies them normally).
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_pass http://127.0.0.1:8010;
    }
  }
}
