# Internal gate for catalog: sits in front of the FastAPI app (same pod /
# network namespace as catalog and catalog-opa, see docker-compose.yml's
# `network_mode: "service:catalog"` and k8s/base/catalog/deployment.yaml),
# occupying the port every other service already calls this one at
# (catalog:8000) so nothing outside this pod needs to change.
#
# GET requests are catalog's public read paths (list/detail) -- forwarded
# straight through, no check. Everything else (POST/PATCH/DELETE) is
# admin-only today (see policies/catalog.rego), enforced here instead of
# in catalog's own Python (services/catalog/src/catalog/auth.py, retired).
#
# Why this needs a real proxied upstream for the auth check, not just
# nginx config: `auth_request_set $x $upstream_http_...` only reads
# response headers from a subrequest answered by an actual upstream
# module (proxy_pass/fastcgi/etc) -- verified directly that neither a
# bare `return`+`add_header` nor an njs `js_content` response propagates
# through $upstream_http_*, even though the subrequest's own response
# headers are set correctly either way. Hence internal-gate: a real HTTP
# service nginx proxies to, mirroring the exact pattern
# /internal/auth-verify already uses against auth-backend at the Gateway
# boundary (see ../nginx.conf).
worker_processes 1;
events {
  worker_connections 128;
}

http {
  map $request_method $catalog_needs_auth {
    default 1;
    GET     0;
  }

  server {
    listen 8000;
    client_max_body_size 25m; # product image uploads (20MB limit + margin)

    location = /internal/verify {
      internal;
      proxy_pass http://127.0.0.1:8090/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Internal-Token $http_x_internal_token;
      proxy_set_header X-Original-Method $request_method;
    }

    location / {
      # error_page trick to conditionally require auth_request only for
      # non-GET methods -- auth_request itself can't be made conditional
      # directly (no `if` support for it), so GET falls straight through
      # here and everything else redirects to the @gated named location.
      error_page 418 = @gated;
      if ($catalog_needs_auth) {
        return 418;
      }
      proxy_pass http://127.0.0.1:8010;
    }

    location @gated {
      auth_request /internal/verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_pass http://127.0.0.1:8010;
    }
  }
}
