worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Static upstreams: services/auth-backend is always present in this
  # compose stack, so resolving its name once at nginx startup is fine.
  upstream auth_backend {
    server auth-backend:3000;
  }

  upstream catalog_service {
    server catalog:8000;
  }

  upstream inventory_service {
    server inventory:8000;
  }

  upstream orders_service {
    server orders:8000;
  }

  upstream telemetry_service {
    server telemetry:8000;
  }

  upstream security_service {
    server security:8000;
  }

  # Used by /ws/ and /api/chat/'s variable-based proxy_pass (see below) —
  # deferring DNS resolution to request time via the Docker embedded
  # resolver, instead of a static upstream {} block, is what lets
  # `docker compose up --scale chat=2` round-robin across replicas without
  # an nginx restart.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 8080;
    return 301 https://$host:8443$request_uri;
  }

  server {
    listen 8443 ssl;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    # Internal-only target for auth_request. Forwards just the Authorization
    # header to auth-backend and discards the body (auth_request only cares
    # about the response status + headers, not a body).
    location = /internal/auth-verify {
      internal;
      proxy_pass http://auth_backend/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      # Forwarded so auth-backend can look up an existing guest session
      # cookie and know which path is being authorized (guest fallback is
      # only granted on Orders' cart/checkout and Chat's WS/attachment
      # routes) — see services/auth-backend/src/index.ts.
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Original-URI $request_uri;
    }

    # Same as /internal/auth-verify, but forwards $ws_authorization (set in
    # the /ws/ location below) instead of $http_authorization directly —
    # browsers' native WebSocket API can't set an Authorization header on
    # the handshake, so /ws/ accepts a ?token= query param fallback that
    # gets mapped into an Authorization header for this subrequest only.
    location = /internal/auth-verify-ws {
      internal;
      proxy_pass http://auth_backend/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $ws_authorization;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Original-URI $request_uri;
    }

    # Catalog domain service. Same auth_request gate as every other
    # location below — nginx
    # only authenticates here, role-based authorization for admin-only
    # endpoints (POST /categories, POST /products) is enforced by the
    # catalog service itself off the internal token's role claim (STR-118).
    location /api/catalog/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      proxy_pass http://catalog_service/;
    }

    # Inventory domain service. Same auth_request gate as every other
    # location — nginx only authenticates here, role-based authorization for admin-only
    # endpoints (POST /stocks/:id/items, POST /stocks/:id/items/:itemId/move)
    # is enforced by the inventory service itself off the internal token's
    # role claim (STR-118). POST /stocks/check-availability is the sync
    # checkout call Orders will make once it exists.
    location /api/inventory/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      proxy_pass http://inventory_service/;
    }

    # Orders domain service. Same auth_request gate as every other
    # location — but unlike catalog/inventory, /api/orders/cart and
    # /api/orders/checkout are also reachable without a Bearer token:
    # auth-backend mints a guest-role internal token for those two paths
    # (see services/auth-backend/src/auth_backend/main.py). /api/orders/orders still
    # requires a real Keycloak-authenticated customer/admin — that
    # allowlist is enforced inside auth-backend, not here; nginx's job is
    # unchanged: trust whatever auth-backend returns and relay its
    # Set-Cookie (issuing/renewing the guest cookie) back to the client.
    location /api/orders/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;
      auth_request_set $auth_set_cookie $upstream_http_set_cookie;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      add_header Set-Cookie $auth_set_cookie always;

      proxy_pass http://orders_service/;
    }

    location /api/telemetry/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      proxy_pass http://telemetry_service/;
    }

    # Security domain service. Same auth_request gate as every other
    # location — nginx only authenticates here, role-based authorization for the admin-only
    # /users, /visit-log, /warehouses endpoints is enforced by the security
    # service itself off the internal token's role claim (STR-127).
    # POST /auth/fingerprint and POST /auth/nfc are the hardware
    # simulator's ingestion paths, called directly over the compose network
    # bypassing nginx entirely — same trust model as Telemetry's
    # POST /measurements.
    location /api/security/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      proxy_pass http://security_service/;
    }

    # WebSocket proxy for Chat. Uses the resolver-based variable proxy_pass
    # (not a static upstream {} block like every other service) so
    # `docker compose up --scale chat=2` round-robins across replicas
    # without an nginx restart — Chat is the one service the ticket
    # explicitly requires to support this end-to-end.
    location /ws/ {
      # Browsers' native WebSocket API can't set an Authorization header on
      # the handshake — fall back to a ?token= query param, mapped to an
      # Authorization header only for the auth_request subrequest below.
      set $ws_authorization $http_authorization;
      if ($arg_token) {
        set $ws_authorization "Bearer $arg_token";
      }

      auth_request /internal/auth-verify-ws;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      set $chat_upstream "chat:8000";
      proxy_pass http://$chat_upstream;
    }

    # Chat's REST endpoints (GET /rooms, GET /rooms/:id/messages,
    # DELETE /rooms/:id, POST /rooms/:id/attachments). Same auth_request
    # gate as every other location — nginx only authenticates here, admin-only vs.
    # participant-only authorization is enforced by the chat service itself
    # off the internal token's role/sub claims (STR-128). Attachment
    # uploads are also reachable by guests on their own room, so — like
    # /api/orders/ — this relays Set-Cookie for guest-cookie issuance, and
    # uses the same resolver-based variable proxy_pass as /ws/ above for
    # scale-out support.
    location /api/chat/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;
      auth_request_set $auth_set_cookie $upstream_http_set_cookie;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      add_header Set-Cookie $auth_set_cookie always;

      set $chat_upstream "chat:8000";
      proxy_pass http://$chat_upstream/;
    }
  }
}
