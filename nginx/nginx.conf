worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Every domain service is proxied via a resolver-based variable
  # proxy_pass (`set $x_upstream "host:port"; proxy_pass http://$x_upstream/;`)
  # rather than a static upstream {} block. A static upstream {} resolves
  # its server's DNS name once, at nginx startup — after that, rebuilding a
  # container (a new IP from Docker's embedded DNS) leaves nginx routing to
  # the old, now-dead IP until nginx itself is restarted (see STR-135: this
  # silently 404'd all of /api/orders/ after `docker compose up --build
  # orders`). Deferring resolution to request time via `resolver` below —
  # bounded by `valid=5s`, so a rebuilt/rescaled container is picked up
  # within 5s with no nginx restart — is the same pattern already used for
  # Chat's /ws/ and /api/chat/ (introduced to support
  # `docker compose up --scale chat=2`; see below), now applied everywhere.
  resolver 127.0.0.11 valid=5s;

  # Dev CORS allowlist for the frontend.
  # :5173/:3000 are the frontend's own conventional ports; :5180 is where
  # the containerized frontend/ service (docker-compose.yml) is published
  # since :5173/:3000 are occupied by other things on this host — see
  # frontend/README's "why :5180" note. Only these localhost origins get a
  # non-empty $cors_origin; every other Origin falls through to "" so
  # add_header omits the header entirely rather than echoing an arbitrary
  # origin.
  map $http_origin $cors_origin {
    default "";
    "http://localhost:5173" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://localhost:5180" $http_origin;
  }

  # WebSocket upgrade passthrough for the catch-all `location /` (the Vite
  # dev server's HMR socket). "" for a normal request so it doesn't get a
  # bogus `Connection: upgrade`. The /ws/ location sets this itself.
  map $http_upgrade $connection_upgrade {
    default "";
    websocket "upgrade";
  }

  # Phase 3: rate limit for the public MCP door (/mcp). Per client IP — an
  # external MCP client (Claude Desktop &c.) making a burst of tool calls is
  # normal; a flood is not. Tune per deployment.
  limit_req_zone $binary_remote_addr zone=mcp_public:10m rate=60r/m;

  server {
    listen 8080;
    return 301 https://$host:8443$request_uri;
  }

  server {
    listen 8443 ssl;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    # Without this, nginx's proxy_pass default for the Host header sent
    # upstream is $proxy_host — i.e. the container address it's proxying to
    # ("inventory:8000", "orders:8000", ...), not the client's original
    # Host. Every domain service here is a FastAPI/Starlette app with the
    # default redirect_slashes=True, and any trailing-slash mismatch
    # between a caller's request path and the registered route makes it
    # issue a 307 whose Location is built from that Host header — so the
    # browser was handed an absolute http://inventory:8000/... redirect
    # target it can neither resolve nor treat as same-origin. Inherited by
    # every location below (proxy_set_header is block-inherited unless a
    # location overrides it).
    proxy_set_header Host $host;

    # Internal-only target for auth_request. Forwards just the Authorization
    # header to auth-backend and discards the body (auth_request only cares
    # about the response status + headers, not a body).
    location = /internal/auth-verify {
      internal;
      set $auth_upstream "auth-backend:3000";
      proxy_pass http://$auth_upstream/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
      # Forwarded so auth-backend can look up an existing guest session
      # cookie and know which path is being authorized (guest fallback is
      # only granted on Orders' cart/checkout and Chat's WS/attachment
      # routes) — see services/auth-backend/src/index.ts.
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Original-URI $request_uri;
    }

    # Same as /internal/auth-verify, but forwards $ws_authorization (set in
    # the /ws/ location below) instead of $http_authorization directly —
    # browsers' native WebSocket API can't set an Authorization header on
    # the handshake, so /ws/ accepts a ?token= query param fallback that
    # gets mapped into an Authorization header for this subrequest only.
    location = /internal/auth-verify-ws {
      internal;
      set $auth_upstream "auth-backend:3000";
      proxy_pass http://$auth_upstream/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $ws_authorization;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header X-Original-URI $request_uri;
    }

    # Catalog domain service. Same auth_request gate as every other
    # location below — nginx
    # only authenticates here, role-based authorization for admin-only
    # endpoints (POST /categories, POST /products) is enforced by the
    # catalog service itself off the internal token's role claim (STR-118).
    location /api/catalog/ {
      add_header 'Access-Control-Allow-Origin' $cors_origin always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Retry' always;
        add_header 'Content-Length' 0;
        return 204;
      }

      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;
      # Catalog browsing is guest-allowed (see auth-backend's
      # GUEST_ALLOWED_PATH_PREFIXES) — an anonymous visitor's first request
      # here mints a fresh guest session and needs its Set-Cookie relayed
      # back, same as /api/orders/'s cart/checkout guest flow, or the
      # cookie never reaches the browser and every subsequent request
      # (including to Orders' cart) mints yet another throwaway guest_id.
      auth_request_set $auth_set_cookie $upstream_http_set_cookie;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      add_header Set-Cookie $auth_set_cookie always;

      # proxy_pass with a variable never does the automatic "replace the
      # matched location prefix" rewrite that a literal upstream target
      # does — it always forwards the request URI verbatim, prefix and
      # all, and the trailing "/" here doesn't change that. Stripping the
      # prefix explicitly via `rewrite ... break` (which changes $uri
      # before proxy_pass runs) reproduces that behavior; proxy_pass is
      # deliberately given no URI of its own so it forwards the rewritten
      # $uri instead of the original request URI. `set` has to come
      # *before* `rewrite ... break` — break stops all subsequent
      # ngx_http_rewrite_module directives in this location (set included),
      # so a `set` placed after it would silently never run, leaving
      # $catalog_upstream empty.
      set $catalog_upstream "catalog:8000";
      rewrite ^/api/catalog/(.*)$ /$1 break;
      proxy_pass http://$catalog_upstream;
    }

    # Inventory domain service. Same auth_request gate as every other
    # location — nginx only authenticates here, role-based authorization for admin-only
    # endpoints (POST /stocks/:id/items, POST /stocks/:id/items/:itemId/move)
    # is enforced by the inventory service itself off the internal token's
    # role claim (STR-118). POST /stocks/check-availability is the sync
    # checkout call Orders will make once it exists.
    location /api/inventory/ {
      add_header 'Access-Control-Allow-Origin' $cors_origin always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Retry' always;
        add_header 'Content-Length' 0;
        return 204;
      }

      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      # See /api/catalog/'s comment above for why the prefix has to be
      # stripped explicitly via `rewrite ... break` (in that order relative
      # to `set`) rather than relying on proxy_pass's trailing slash.
      set $inventory_upstream "inventory:8000";
      rewrite ^/api/inventory/(.*)$ /$1 break;
      proxy_pass http://$inventory_upstream;
    }

    # Orders domain service. Same auth_request gate as every other
    # location — but unlike catalog/inventory, /api/orders/cart and
    # /api/orders/checkout are also reachable without a Bearer token:
    # auth-backend mints a guest-role internal token for those two paths
    # (see services/auth-backend/src/auth_backend/main.py). /api/orders/orders still
    # requires a real Firebase-authenticated customer/admin — that
    # allowlist is enforced inside auth-backend, not here; nginx's job is
    # unchanged: trust whatever auth-backend returns and relay its
    # Set-Cookie (issuing/renewing the guest cookie) back to the client.
    # Stripe's webhook -- called server-to-server by Stripe, not the
    # browser, so it carries no internal token and no Origin to run the
    # CORS/auth_request gate against. `location =` (exact match) always
    # wins over the `/api/orders/` prefix location below regardless of
    # declaration order, so this is exempted from both. Authenticated
    # instead by the Stripe-Signature header, verified in
    # routers/payments.py's stripe_webhook via STRIPE_WEBHOOK_SECRET.
    location = /api/orders/webhooks/stripe {
      set $orders_upstream "orders:8000";
      rewrite ^/api/orders/(.*)$ /$1 break;
      proxy_pass http://$orders_upstream;
    }

    location /api/orders/ {
      add_header 'Access-Control-Allow-Origin' $cors_origin always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      if ($request_method = OPTIONS) {
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Retry' always;
        add_header 'Content-Length' 0;
        return 204;
      }

      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;
      auth_request_set $auth_set_cookie $upstream_http_set_cookie;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      add_header Set-Cookie $auth_set_cookie always;

      # See /api/catalog/'s comment above for why the prefix has to be
      # stripped explicitly via `rewrite ... break` (in that order relative
      # to `set`) rather than relying on proxy_pass's trailing slash.
      set $orders_upstream "orders:8000";
      rewrite ^/api/orders/(.*)$ /$1 break;
      proxy_pass http://$orders_upstream;
    }

    location /api/telemetry/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      # See /api/catalog/'s comment above for why the prefix has to be
      # stripped explicitly via `rewrite ... break` (in that order relative
      # to `set`) rather than relying on proxy_pass's trailing slash.
      set $telemetry_upstream "telemetry:8000";
      rewrite ^/api/telemetry/(.*)$ /$1 break;
      proxy_pass http://$telemetry_upstream;
    }

    # STR-147: Telemetry's CQRS read model — net-new, directly-consumed
    # service (not proxied through /api/telemetry/), same auth_request gate
    # as every other domain-service location. See
    # services/telemetry-aggregates/README.md.
    location /api/telemetry-aggregates/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      set $telemetry_aggregates_upstream "telemetry-aggregates:8000";
      rewrite ^/api/telemetry-aggregates/(.*)$ /$1 break;
      proxy_pass http://$telemetry_aggregates_upstream;
    }

    # Security domain service. Same auth_request gate as every other
    # location — nginx only authenticates here, role-based authorization for the admin-only
    # /users, /visit-log, /warehouses endpoints is enforced by the security
    # service itself off the internal token's role claim (STR-127).
    # POST /auth/fingerprint and POST /auth/nfc are the hardware
    # simulator's ingestion paths, called directly over the compose network
    # bypassing nginx entirely — same trust model as Telemetry's
    # POST /measurements.
    location /api/security/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      # See /api/catalog/'s comment above for why the prefix has to be
      # stripped explicitly via `rewrite ... break` (in that order relative
      # to `set`) rather than relying on proxy_pass's trailing slash.
      set $security_upstream "security:8000";
      rewrite ^/api/security/(.*)$ /$1 break;
      proxy_pass http://$security_upstream;
    }

    # WebSocket proxy for Chat. Uses the same resolver-based variable
    # proxy_pass as every other location (see the top-level `resolver`
    # comment) — originally introduced here to let
    # `docker compose up --scale chat=2` round-robin across replicas
    # without an nginx restart, later extended repo-wide (STR-135).
    location /ws/ {
      # Browsers' native WebSocket API can't set an Authorization header on
      # the handshake — fall back to a ?token= query param, mapped to an
      # Authorization header only for the auth_request subrequest below.
      set $ws_authorization $http_authorization;
      if ($arg_token) {
        set $ws_authorization "Bearer $arg_token";
      }

      auth_request /internal/auth-verify-ws;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Drop the client's compression offer so the WS server never
      # negotiates permessage-deflate: ngrok's free tunnel mangles
      # compressed frames and drops the socket ~30ms after the 101. Chat
      # frames are tiny JSON — nothing to compress anyway.
      proxy_set_header Sec-WebSocket-Extensions "";

      set $chat_upstream "chat:8000";
      proxy_pass http://$chat_upstream;
    }

    # Chat's REST endpoints (GET /rooms, GET /rooms/:id/messages,
    # DELETE /rooms/:id, POST /rooms/:id/attachments). Same auth_request
    # gate as every other location — nginx only authenticates here, admin-only vs.
    # participant-only authorization is enforced by the chat service itself
    # off the internal token's role/sub claims (STR-128). Attachment
    # uploads are also reachable by guests on their own room, so — like
    # /api/orders/ — this relays Set-Cookie for guest-cookie issuance, and
    # uses the same resolver-based variable proxy_pass as /ws/ above for
    # scale-out support.
    location /api/chat/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;
      auth_request_set $auth_set_cookie $upstream_http_set_cookie;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      add_header Set-Cookie $auth_set_cookie always;

      # STR-135: this location's proxy_pass already used a resolver-based
      # variable (unlike the other services, pre-dating that ticket), but
      # the trailing "/" alone was never actually stripping the /api/chat/
      # prefix — proxy_pass with a variable always forwards the request URI
      # verbatim, so every request here was 404ing against Chat's own
      # /rooms-prefixed routes. Undiscovered until STR-135, since nothing in
      # this repo's test suite exercises Chat's REST endpoints through
      # nginx (test-chat-saga.sh only goes through /ws/, whose target route
      # happens to be mounted at the exact same path nginx receives, so it
      # never needed stripping and never surfaced this). See /api/catalog/'s
      # comment above for why `rewrite ... break` has to come after `set`.
      set $chat_upstream "chat:8000";
      rewrite ^/api/chat/(.*)$ /$1 break;
      proxy_pass http://$chat_upstream;
    }

    # ── Public MCP door (Phase 3) ────────────────────────────────────────
    # mcp-gateway's in-mesh `/mcp` (X-Internal-Token, the ADK agents) has no
    # location here. What's exposed is the *public* MCP endpoint and the
    # small OAuth 2.1 Authorization Server it runs alongside — the Gateway
    # itself is the issuer (`PUBLIC_BASE_URL` == this origin), so its
    # `/authorize`, `/token`, `/register`, `/oauth/login` and metadata live
    # at this root. All proxied straight through, unauthenticated — the
    # Gateway owns auth (`RequireAuthMiddleware` on `/mcp`, the AS handlers
    # elsewhere). No `auth_request` here.

    # OAuth AS + discovery endpoints (RFC 8414 / 9728 / 7591).
    location ~ ^/(authorize|token|register|revoke|oauth/login)$ {
      set $mcp_upstream "mcp-gateway:8000";
      proxy_pass http://$mcp_upstream;
    }
    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource|jwks\.json) {
      set $mcp_upstream "mcp-gateway:8000";
      proxy_pass http://$mcp_upstream;
    }

    # The MCP endpoint itself — Bearer-authenticated inside the Gateway.
    location = /mcp {
      limit_req zone=mcp_public burst=20 nodelay;

      # Streamable HTTP: POST -> one JSON reply, GET -> a possibly long-lived
      # SSE channel. Don't buffer; allow a long idle stream.
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_http_version 1.1;

      set $mcp_upstream "mcp-gateway:8000";
      proxy_pass http://$mcp_upstream;
    }

    # Self-service registration — auth-backend creates the Firebase user and
    # sets its `role: customer` claim (see auth_backend/main.py). No
    # auth_request: the caller has no token yet, that's the point.
    location = /api/auth/register {
      set $auth_reg_upstream "auth-backend:3000";
      rewrite ^/api/auth/(.*)$ /auth/$1 break;
      proxy_pass http://$auth_reg_upstream;
    }

    # ── Firebase Auth emulator ───────────────────────────────────────────
    # The Firebase JS SDK, once pointed at an emulator origin, sends its
    # REST calls to <origin>/identitytoolkit.googleapis.com/… and
    # /securetoken.googleapis.com/…. Routing those here lets a remote
    # browser (through the tunnel) sign in against the local emulator using
    # the page's own origin — no localhost:9099 reachability needed. See
    # frontend/src/services/firebase/client.ts (FIREBASE_AUTH_EMULATOR_HOST
    # = "origin") and docker-compose.yml. Unauthenticated: it's an emulator.
    location ~ ^/(identitytoolkit\.googleapis\.com|securetoken\.googleapis\.com|emulator)/ {
      set $fb_upstream "firebase-emulator:9099";
      proxy_pass http://$fb_upstream;
    }

    # ── The frontend SPA (Vite dev server) ───────────────────────────────
    # Least-specific location: matched only when nothing above did. Serving
    # the app through nginx means one origin — and so one ngrok/cloudflared
    # tunnel — covers the whole demo: UI here, REST under /api/, WebSocket
    # at /ws/, the public MCP door at /mcp. The frontend must then use an
    # origin-relative API base (VITE_SERVER_URL=/api/) and allow this Host
    # (VITE_ALLOWED_HOSTS) — see docker-compose.yml.
    location / {
      set $frontend_upstream "frontend:5180";
      proxy_pass http://$frontend_upstream;
      proxy_http_version 1.1;
      # Forward the real client Host (not "$proxy_host" = "frontend"), or
      # Vite 6 blocks it as a disallowed host.
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
