worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # Static upstreams: services/auth-backend and services/echo-service are
  # always present in this compose stack, so resolving their names once at
  # nginx startup is fine.
  upstream auth_backend {
    server auth-backend:3000;
  }

  upstream echo_service {
    server echo-service:4000;
  }

  upstream catalog_service {
    server catalog:8000;
  }

  upstream inventory_service {
    server inventory:8000;
  }

  # chat-service doesn't exist yet (see docs/adr/0001). Using a variable in
  # proxy_pass defers DNS resolution to request time via the Docker embedded
  # resolver, so nginx still starts cleanly today; /ws/ just 502s until a
  # chat-service is added to docker-compose.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 8080;
    return 301 https://$host:8443$request_uri;
  }

  server {
    listen 8443 ssl;

    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;

    # Internal-only target for auth_request. Forwards just the Authorization
    # header to auth-backend and discards the body (auth_request only cares
    # about the response status + headers, not a body).
    location = /internal/auth-verify {
      internal;
      proxy_pass http://auth_backend/auth/verify;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Authorization $http_authorization;
    }

    # Routing to domain services. All application traffic is gated by
    # auth-backend's /auth/verify: nginx never validates the JWT itself, it
    # only trusts the 200/401 (and X-User-* headers) auth-backend returns —
    # see docs/adr/0001-replace-custom-identity-with-keycloak.md.
    location / {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      proxy_pass http://echo_service;
    }

    # Catalog domain service. Same auth_request gate as location / — nginx
    # only authenticates here, role-based authorization for admin-only
    # endpoints (POST /categories, POST /products) is enforced by the
    # catalog service itself off the internal token's role claim (STR-118).
    location /api/catalog/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      proxy_pass http://catalog_service/;
    }

    # Inventory domain service. Same auth_request gate as location / — nginx
    # only authenticates here, role-based authorization for admin-only
    # endpoints (POST /stocks/:id/items, POST /stocks/:id/items/:itemId/move)
    # is enforced by the inventory service itself off the internal token's
    # role claim (STR-118). POST /stocks/check-availability is the sync
    # checkout call Orders will make once it exists.
    location /api/inventory/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      proxy_pass http://inventory_service/;
    }

    # WebSocket proxy for the future Chat service. Not wired to a running
    # upstream yet — kept here so the auth_request + Upgrade-header pattern
    # is in place before Chat exists.
    location /ws/ {
      auth_request /internal/auth-verify;
      auth_request_set $user_id $upstream_http_x_user_id;
      auth_request_set $user_role $upstream_http_x_user_role;
      auth_request_set $internal_token $upstream_http_x_internal_token;

      proxy_set_header Authorization "";
      proxy_set_header X-User-Id $user_id;
      proxy_set_header X-User-Role $user_role;
      proxy_set_header X-Internal-Token $internal_token;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      set $chat_upstream "chat-service:5000";
      proxy_pass http://$chat_upstream;
    }
  }
}
