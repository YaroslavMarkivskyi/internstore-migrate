[project]
name = "inventory"
version = "0.1.0"
description = "InternStore Inventory service — stocks and stock items"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "pyjwt>=2.9.0",
    "aiokafka>=0.14.0",
    # STR-140: AuthzClient's OPA sidecar call (authz.py) -- previously only
    # a dev/test dependency despite catalog_client.py already using it at
    # runtime.
    "httpx>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    # STR-140: mocks AuthzClient's httpx calls in test_authz_client.py,
    # same tool orders' test_inventory_client.py already uses for this.
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory"]
