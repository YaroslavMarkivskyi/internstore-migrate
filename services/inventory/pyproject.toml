[project]
name = "inventory"
version = "0.1.0"
description = "InternStore Inventory service — stocks and stock items"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "aiokafka>=0.14.0",
    # catalog_client.py's outbound call to Catalog (unpublish-on-zero-stock).
    "httpx>=0.27.2",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "pyjwt>=2.9.0",
    # mocks catalog_client.py's outbound httpx calls in tests, same tool
    # orders' test_inventory_client.py uses for its own outbound client.
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory"]
