[project]
name = "ai-assistant"
version = "0.1.0"
description = "InternStore AI Assistant service — Gemini-powered chat agent for customers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.6",
    "alembic>=1.13.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "pyjwt>=2.9.0",
    "aiokafka>=0.11.0",
    "httpx>=0.27.2",
    "redis>=5.0.8",
    # STR-161b: replaces openai — talks to Gemini via the Gemini Enterprise
    # Agent Platform (the Cloud Next 2026 rebrand of Vertex AI). Pinned
    # below 3.0 per the SDK's own README: breaking changes to Automatic
    # Function Calling are planned for 3.0, and this service builds its
    # tool declarations manually (see react_loop.py), not via AFC.
    "google-genai>=2.19,<3.0.0",
    # Agent framework: shopping + ops agents run on ADK's LlmAgent/Runner
    # (see src/ai_assistant/adk/). ADK 2.x consumes the MCP Gateway through
    # its McpToolset, which requires the mcp 1.x client SDK — the Gateway's
    # own server is pinned to match (services/mcp-gateway).
    "google-adk>=2.8.0,<3",
    "mcp>=1.9.0,<2.0.0",
    # ADK caps opentelemetry-api/sdk at <=1.42.1; the rest of the OTel stack
    # is brought down to the matching line. The observability module only
    # uses long-stable SDK surface, so this is a version move, not an API one.
    "opentelemetry-sdk>=1.39,<=1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39,<=1.42.1",
    "opentelemetry-instrumentation-fastapi>=0.60b0",
    "opentelemetry-instrumentation-httpx>=0.60b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "respx>=0.21.1",
    "fakeredis>=2.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Evals (evals/) call a real Gemini model and cost money — excluded from
# the default run. Opt in with `uv run pytest -m eval` (needs GCP_PROJECT
# + ADC). See evals/README.md.
addopts = "-m 'not eval'"
markers = [
    "eval: live shopping-agent behaviour check against a real model (costs money, non-deterministic)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_assistant"]
