[project]
name = "checkout-workflow"
version = "0.1.0"
description = "InternStore checkout-workflow — Temporal orchestration for checkout, parallel to Orders' Kafka-choreographed saga (STR-139)"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.7.0",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "pyjwt>=2.9.0",
    "aiokafka>=0.14.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkout_workflow"]
