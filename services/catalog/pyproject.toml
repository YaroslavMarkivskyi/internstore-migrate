[project]
name = "catalog"
version = "0.1.0"
description = "InternStore Catalog service — categories and products"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "aiokafka>=0.14.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.12",
    # STR-140: AuthzClient's OPA sidecar call (authz.py) -- previously only
    # a dev/test dependency despite inventory_client.py already using it at
    # runtime.
    "httpx>=0.27.2",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    # Spike: catalog no longer verifies internal tokens itself (OPA does,
    # via common.rego) -- pyjwt is now only needed to mint tokens for
    # tests (conftest.py's mint_internal_token) and to simulate what OPA
    # verifies (FakeAuthzClient), not by any src/catalog code.
    "pyjwt>=2.9.0",
    # STR-140: mocks AuthzClient's httpx calls in test_authz_client.py,
    # same tool orders' test_inventory_client.py already uses for this.
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]
