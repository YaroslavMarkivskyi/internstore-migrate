[project]
name = "mcp-gateway"
version = "0.1.0"
description = "InternStore MCP Gateway — exposes domain service data as MCP tools for AI agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "pyjwt>=2.9.0",
    "httpx>=0.27.2",
    "mcp>=1.9.0,<2.0.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.6",
    # STR-161b: replaces openai — search_products embeds the query via
    # Gemini (see tools/catalog.py), same SDK/pin rationale as ai-assistant.
    "google-genai>=1.0.0,<3.0.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]
